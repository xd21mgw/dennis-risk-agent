schema_version: source_readiness_matrix_v1
purpose: >
  Track Dennis Risk Agent source readiness separately from source priority.
  A source can be P0 by evidence value while still being runner-incomplete or auth-gated.

status_enum:
  - runner_ready
  - health_check_verified
  - playbook_ready
  - not_connected
  - requires_authorization
  - playbook_ready_not_runner_ready
  - endpoint_verified_not_runner_ready
  - dry_run_contract_ready
  - candidate_runner
  - planned_or_minimal_stub
  - browser_backed_batch_ready
  - debug_only_runner_ready
  - available
  - source_not_connected
  - service_contract_pending
  - blocked_by_missing_request_shape
  - service_body_visibility_gap
  - parser_mapping_gap
  - json_array_capped
  - byte_limit
  - partial_source

global_boundaries:
  no_data_not_risk_exclusion: true
  source_priority_decided_by_evidence_value: true
  access_method_is_collection_path_only: true
  no_live_auth_repair_in_business_case: true
  no_cookie_token_session_header_output: true
  runtime_case_execution_entry: computer_use_poc/runtime_case_execution_runner.py
  case_execution_uses_controlled_batch: true
  legacy_runner_fallback_forbidden_in_case_execution: true
  browser_backed_single_action_freeform_forbidden_by_default: true

sources:
  user_login_unified_log:
    source_priority: P0
    readiness_status:
      - browser_backed_batch_ready
      - playbook_ready
    supported_input:
      - user_id
      - time_window
    output_summary:
      - login_events
      - login_method
      - device_summary
      - ip_region_summary
      - reliable_window_boundary
    boundary:
      - online_window_limited
      - no_data_not_risk_exclusion
      - case_execution_access_method_browser_backed_batch
      - no_sso_session_runner_fallback

  weapon_graphData:
    source_priority: P0
    readiness_status:
      - browser_backed_batch_ready
      - playbook_ready
    supported_input:
      - user_id
    output_summary:
      - user_device_edges
      - candidate_device_ids
      - graph_edge_count
    boundary:
      - graphData_empty_not_no_device
      - raw_device_id_internal_only
      - case_execution_conditional_only
      - no_legacy_weapon_runner_fallback

  weapon_riskData:
    source_priority: P0-conditional
    readiness_status:
      - browser_backed_batch_ready
      - playbook_ready
    supported_input:
      - device_id
    trigger_condition:
      - graphData_deviceId
      - login_log_deviceId
      - publish_chain_deviceId
      - track_analysis_deviceId
    output_summary:
      - device_risk_tags
      - environment_risk_summary
    boundary:
      - missing_device_reference_when_no_device_id
      - device_risk_not_standalone_judgement
      - case_execution_conditional_only
      - no_legacy_weapon_runner_fallback

  archives_profile_readonly:
    source_priority: P0
    readiness_status:
      - browser_backed_batch_ready
      - playbook_ready
    supported_input:
      - user_id
    access_method:
      - same_origin_fetch_if_auth_ready
      - controlled_browser_cookie_activation_if_needed
    output_summary:
      - user_profile_summary
      - account_status
      - ban_or_downrank_summary
      - register_device_summary
      - login_device_summary
    success_marker:
      archives_profile_source_status: completed
      condition: homeInfo_available
    boundary:
      - readonly
      - no_cookie_token_session_header_output
      - no_auth_repair_in_business_case
      - auth_failed_marks_archives_auth_gap
      - no_publish_device_id_means_cannot_judge_publish_device_anomaly
      - browser_backed_body_missing_enters_source_quality
      - no_archives_profile_runner_fallback

  archives_publish_device_trace:
    source_priority: P0-conditional
    readiness_status:
      - browser_backed_batch_ready
      - available
    supported_input:
      - user_id
      - photo_id
      - publish_id
      - publish_time
    browser_backed_actions:
      - archives_photo_profile
      - archives_photo_meta
      - archives_gallery_photo_list
    output_summary:
      - publish_list
      - publish_time
      - publish_device
      - publish_source_chain
      - publish_ip_ua_if_available
    boundary:
      - profile_meta_next_hop_only_when_photo_id_or_publish_gap_exists
      - completed_transport_not_business_evidence
      - service_body_visibility_gap_not_business_no_data
      - parser_mapping_gap_enters_missing_evidence

  tianshi_strategy_hit_inventory:
    source_priority: P0-explicit
    readiness_status:
      - dry_run_contract_ready
      - playbook_ready
    supported_input:
      - user_id_candidate
      - source_id
      - event_id
      - device_id
      - time_window
    output_summary:
      - strategy_hit_overview
      - hit_policy_summary
      - risk_decision_summary
    boundary:
      - explicit_target_when_user_asks_policy_hit
      - not_final_risk_judgement
      - missing_required_fields_becomes_source_gap
      - dry_run_only_not_platform_evidence
      - live_readonly_not_verified

  rcp_event_detail:
    source_priority: conditional
    readiness_status:
      - dry_run_contract_ready
      - playbook_ready
    supported_input:
      - user_id_candidate
      - source_id
      - event_id
      - event_type
      - query_time
    output_summary:
      - event_detail
      - request_context_summary
    boundary:
      - partial_api_direct
      - not_general_user_id_lookup

  rcp_strategy_governance_auxiliary:
    source_priority: P0-explicit
    readiness_status:
      - browser_backed_batch_ready
      - available
    supported_input:
      - event_id
      - event_type
      - query_time
      - policy_code
      - policy_tree_code
      - feature_keys
    browser_backed_actions:
      - rcp_event_tree_or_decision
      - rcp_fast_query_hbase
      - rcp_feature_info_by_keys
      - rcp_policy_basic_info
      - rcp_relation_policy_tree
      - rcp_policy_binding_info_list
      - rcp_policy_search
      - rcp_policy_blur_search
      - rcp_policy_all_version
      - rcp_pipeline_policy_versions_by_code
    output_summary:
      - event_decision_tree
      - feature_key_context
      - policy_basic_info
      - policy_tree_relation
      - policy_version_history
    boundary:
      - explicit_strategy_or_event_anchor_only
      - not_default_ato_source
      - strategy_hit_not_final_judgement
      - raw_tree_dump_not_user_output

  track_auxiliary_discovery:
    source_priority: P2-helper
    readiness_status:
      - browser_backed_batch_ready
      - available
    supported_input:
      - product
      - appName
    browser_backed_actions:
      - track_analysis_product_list
      - track_sequence_dimension_list
      - track_data_type_list
    output_summary:
      - product_candidates
      - sequence_dimensions
      - data_type_candidates
    boundary:
      - parameter_discovery_only
      - not_risk_conclusion_source
      - not_default_ato_main_chain

  track_analysis_activity_profile:
    source_priority: P0_auxiliary_for_ato
    readiness_status:
      - browser_backed_batch_ready
      - endpoint_verified_not_runner_ready
      - playbook_ready
    supported_input:
      - user_id
      - device_id
      - appName
    output_summary:
      - profile_card
      - device_ids
      - daily_duration_rows
      - active_days_bucket
      - event_day_activity_alignment
    boundary:
      - endpoint_verified_but_no_runner
      - activity_signal_not_final_judgement
      - no_data_not_risk_exclusion
      - readiness_check_only_in_ato_default_plan
      - no_track_runner_fallback

  archives_photo_search:
    source_priority: P0_for_ato_content_publish_handoff
    readiness_status:
      - browser_backed_batch_ready
      - playbook_ready
    supported_input:
      - user_id
      - time_window
      - page
      - count
    output_summary:
      - photo_id_or_content_id
      - publish_time
      - publish_source
      - publish_device_or_ip_ua_if_available
      - audit_or_strategy_reason
    boundary:
      - ato_default_p0_source
      - no_data_not_abnormal_publish_or_ato_exclusion
      - auth_failed_timeout_parse_error_enter_missing_evidence

  login_logs_json_array_capped:
    source_priority: P0
    readiness_status:
      - browser_backed_batch_ready
      - json_array_capped
      - partial_source
    supported_input:
      - user_id
      - time_window
      - max_records
    output_summary:
      - login_events_returned_records
      - observed_records
      - returned_records
      - missing_records
      - cap_reason_byte_limit
    boundary:
      - returned_records_are_partial_evidence_only
      - missing_records_not_no_data
      - byte_limit_partial_source
      - no_login_low_risk_from_large_response

  dataagent_hive:
    source_priority: P2
    readiness_status:
      - requires_authorization
      - playbook_ready
    supported_input:
      - approved_query_scope
      - table
      - time_window
      - fields
    output_summary:
      - offline_history_evidence
      - long_window_login_chain
      - batch_or_cross_table_result
    boundary:
      - per_call_authorization_required
      - query_plan_allowed_without_execution
      - pending_query_not_completed_evidence
