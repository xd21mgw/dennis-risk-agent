        },
        {
          "source_name": "publish_chain_if_abnormal_publish_or_content_operation",
          "source_priority": "P0-conditional",
          "readiness_status": "publish_chain_visible_in_latest_live_validation",
          "latest_live_validation": "video_tab_visible_7_items",
          "condition": "abnormal_publish_or_traffic_diversion_content_or_non_owner_publish_or_content_operation",
          "fields": [
            "publish_time",
            "publish_item_id",
            "content_type_summary",
            "play_count",
            "comment_count",
            "like_count",
            "collect_count",
            "status",
            "publish_device",
            "publish_ip_or_region_if_available",
            "publish_source_chain"
