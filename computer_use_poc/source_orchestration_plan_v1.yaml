      "controlled_parallel_batch_contract": {
        "service_batch_endpoint": "/actions/batch",
        "service_plan_endpoint": "/actions/multi_source_plan",
        "runtime_case_execution_entry": "computer_use_poc/runtime_case_execution_runner.py",
        "contract_name": "controlled_parallel_executable",
        "default_runtime_routing": false,
        "service_output_mode": "pure_passthrough_transport_envelope",
        "source_plan_required": true,
        "legacy_runner_fallback_allowed": false,
        "browser_backed_single_action_freeform_allowed": false,
        "direct_platform_curl_allowed": false,
        "manual_local_actions_batch_curl_fallback_allowed": false,
        "harness_error_policy": "return_structured_harness_error_source_gap_no_manual_curl_fallback",
        "service_single_source_envelope_fields": [
          "action_name",
          "source_id",
          "platform",
          "http_status",
          "content_type",
          "body_present",
          "body_truncated",
          "observed_bytes",
          "elapsed_ms",
          "transport_error",
          "platform_error",
          "invalid_params",
          "timeout",
          "auth_redirect_detected",
          "raw_body_handling"
        ],
        "service_batch_output_fields": [
          "batch_status",
          "source_results",
          "transport_status_matrix",
          "classifications",
          "missing_or_failed_sources"
        ],
        "service_legacy_business_fields_not_required": [
          "normalized_observation",
          "source_quality",
          "source_quality_matrix",
          "evidence_card_inputs",
          "source_card",
          "compat_summary",
          "risk_event_scan",
          "feature_group_summary"
        ],
        "dennis_generated_fields": [
          "observation",
          "source_quality_matrix",
          "evidence_card",
          "missing_evidence",
          "final_answer_boundary"
        ],
        "execution_groups_supported": [
          "independent_parallel",
          "dependency_serial",
          "large_response_serial",
          "auth_sensitive_serial"
        ],
        "source_plan_item_required_fields": [
          "source_id",
          "action",
          "execution_group",
          "depends_on",
          "dependency",
          "timeout_class",
          "failure_policy",
          "source_priority",
          "expected_observation"
        ],
        "execution_group_semantics": {
          "independent_parallel": "Sources with no required upstream entity can run concurrently; each source has independent timeout/status/source_quality.",
          "dependency_serial": "Source waits for explicit upstream source_id or required entity fields; upstream failure blocks only dependent source, not unrelated sources.",
          "large_response_serial": "Large or paginated source runs serially to avoid response pressure; partial/limited output is usable partial evidence.",
          "auth_sensitive_serial": "Sources sharing an auth-sensitive origin or SPA context run serially; auth_failed/blocked/timeout enters source_quality and does not trigger auth repair."
        },
        "timeout_classes": {
          "short_readiness": "Low-cost readiness/provenance checks.",
          "standard_readonly": "Normal fixed readonly action timeout.",
          "auth_sensitive": "Shared-auth-context source timeout; no repeated auth probing.",
          "large_response": "Large response or high pageSize source timeout; partial output allowed."
        },
        "failure_policies": {
          "non_blocking_partial": "completed/no_data/partial/auth_failed/blocked/timeout/parse_error all enter source_quality_matrix; failed sources enter missing_evidence; partial answer remains allowed.",
          "dependent_only_block": "Missing upstream fields skip or block only the dependent source with missing_upstream_id/missing_required_fields.",
          "do_not_use_as_counter_evidence": "no_data/partial/auth_failed/timeout/blocked/parse_error cannot support low-risk/no-risk counter evidence.",
          "preserve_completed_sources": "Any completed passthrough source must remain eligible for Dennis-generated evidence card even if a later source fails.",
          "raw_body_suppressed": "Service batch result must not expose raw upstream body to the user-visible answer."
        },
        "merge_contract": {
          "service_output_fields": [
            "batch_result",
            "source_results",
            "transport_status_matrix",
            "classifications",
            "missing_or_failed_sources"
          ],
          "dennis_generated_fields": [
            "source_quality_matrix",
            "evidence_card",
            "missing_evidence"
          ],
          "status_buckets": [
            "completed",
            "no_data",
            "partial",
            "auth_failed",
            "blocked",
            "timeout",
            "parse_error"
          ],
          "completed_or_partial_enters": "dennis_generated_evidence_card",
          "failed_or_missing_enters": "dennis_generated_missing_evidence",
          "no_data_boundary": "no_data_not_risk_exclusion",
          "partial_boundary": "partial_observation_available_is_usable_partial",
          "body_truncated_boundary": "body_truncated_true_means_partial_observation_available",
          "auth_redirect_boundary": "auth_redirect_detected_or_api_code_302_means_auth_flow_not_completed_in_bound_context",
          "raw_body_boundary": "raw_body_suppressed_or_capped_means_limited_observation_only",
          "final_risk_conclusion_generated_by_service": false,
          "raw_upstream_body_user_visible": false
        }
      },
