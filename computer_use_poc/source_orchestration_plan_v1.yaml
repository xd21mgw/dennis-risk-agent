{
  "schema_version": "source_orchestration_plan_v1",
  "plans": {
    "universal_realtime_first_risk_workflow_v1": {
      "applies_to": [
        "generic_risk_judgement",
        "account_security",
        "anti_cheating",
        "traffic_diversion",
        "traffic_anti_cheating",
        "anti_crawler",
        "group_control",
        "activity_anti_cheating",
        "strategy_governance",
        "batch_risk_clustering"
      ],
      "primary_access_method": "orchestration_contract",
      "default_runtime_routing": false,
      "real_platform_access": false,
      "dataagent_hive_execution": false,
      "positioning": "Generic Dennis workflow: realtime readonly evidence first, offline supplement plan when realtime evidence cannot close, and cluster expansion when the user asks for batch/commonality.",
      "workflow": [
        "risk_hypothesis_and_source_plan",
        "realtime_readonly_source_collection",
        "evidence_chain_closure_check",
        "partial_evidence_missing_evidence_when_not_closed",
        "offline_supplement_plan_by_risk_scene",
        "dataagent_hive_per_request_authorization",
        "cluster_expansion_when_batch_or_similar"
      ],
      "required_outputs": [
        "source_plan",
        "evidence_chain",
        "source_quality_matrix",
        "missing_evidence",
        "final_answer_boundary"
      ],
      "closure_rule": {
        "evidence_based_conclusion_allowed_when": [
          "risk_hypothesis_sources_completed_or_qualified",
          "time_window_boundary_clear",
          "source_quality_matrix_clear",
          "counter_evidence_evaluated",
          "missing_evidence_not_decisive_for_current_conclusion"
        ],
        "if_not_closed": "output partial evidence, missing_evidence, offline supplement plan, and no forced final risk judgement"
      },
      "source_quality_boundaries": [
        "no_data_not_risk_exclusion",
        "partial_observation_available_is_usable_partial",
        "auth_failed_timeout_blocked_parse_error_enter_source_quality",
        "source_window_gap_not_counter_evidence",
        "strategy_hit_not_final_judgement",
        "same_device_relation_not_gang_conclusion",
        "archives_failure_non_blocking_when_relevant"
      ],
      "offline_supplement_by_risk_scene": {
