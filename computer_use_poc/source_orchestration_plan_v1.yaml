          "tab_interaction_fallback": "try_accessible_click_once_then_dom_eval_click_then_url_hash_or_route_navigation_if_contract_exists",
          "future_source_name": "archives_publish_device_trace",
          "fallback_status": "tab_switch_failed_or_blocked_or_missing_evidence",
          "boundary": "tab_switch_failed_not_platform_unavailable_publish_device_missing_is_missing_evidence"
        },
        {
          "source_name": "tianshi_strategy_detail_if_user_asks_policy_hit",
          "source_priority": "P0-explicit",
          "readiness_status": "playbook_ready_not_runner_ready",
          "condition": "user_explicitly_asks_policy_detail_or_event_attribution_after_rcp_snapshot",
          "fallback_status": "runner_missing_or_missing_required_fields"
        },
        {
          "source_name": "archives_profile_if_auth_ready",
          "source_priority": "P0_duplicate_compatibility_alias",
          "condition": "archives_auth_ready",
          "fallback_status": "blocked_or_not_checked"
        },
        {
          "source_name": "tianshi_if_event_or_source_id_available",
          "condition": "event_id_or_source_id_available",
          "fallback_status": "missing_required_fields_or_not_checked"
        }
      ],
      "cross_source_rules": {
        "weapon_graphdata_empty_not_no_device": true,
        "allow_track_analysis_device_id_for_weapon_riskdata": true,
        "cross_source_device_id_marker_required": true
      },
      "source_execution_guard": {
        "dennis_case_execution_forbidden": [
          "read_.ks_sso/sso-state.json",
          "manual_cookie_or_header",
          "curl_urllib_requests_with_cookie",
          "debug_SmartSSOSession",
          "debug_sso_session_runner.py_or_sso_session.py",
          "inspect_auth_bridge_implementation",
          "live_auth_repair",
          "tool_troubleshooting_instead_of_source_observation"
        ],
        "allowed_source_call_methods": [
          "task_authorized_browser_same_origin",
          "browser_backed_service",
          "registered_controlled_runner",
          "registered_readonly_api_playbook",
          "task_prompt_explicit_fallback"
        ],
        "attempt_limit_per_source": {
          "primary_path": 1,
          "fallback_path": 1
        },
        "failure_statuses": [
          "tool_gap",
          "auth_bridge_gap",
          "blocked",
          "auth_failed",
          "network_error",
          "platform_error",
          "parameter_error",
          "timeout",
          "parse_error",
          "no_data"
        ],
        "failure_boundary": "failure_status_not_low_risk_or_no_risk_evidence",
        "browser_backed_service_failure_boundary": "blocked_auth_failed_network_error_platform_error_enter_source_completion_matrix_not_runtime_failure"
      },
      "browser_backed_service_adapter_v1": {
        "adapter_doc": "computer_use_poc/browser_backed_service_adapter_v1.md",
        "service_base_url": "http://127.0.0.1:8787",
        "fixed_actions_only": true,
        "dennis_browser_ownership": false,
        "dennis_auth_material_access": false,
        "forbidden_input_keys": [
          "url",
          "path",
          "header",
          "cookie",
          "token",
          "session",
          "secret"
        ],
        "action_mapping": {
          "rcp_strategy_hit_entry": {
            "action_name": "rcp_snapshot",
            "endpoint": "/actions/rcp_snapshot"
          },
          "weapon_device_relation_or_risk": {
            "action_name": "weapon_inventory",
