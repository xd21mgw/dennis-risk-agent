        },
        "rcp_policy_tree_lookup": {
          "platform": "rcp_tianshi",
          "service_registered": true,
          "python_client_endpoint": "/actions/rcp_policy_tree_lookup",
          "source_status": "live_smoke_verified",
          "source_role": "policy_tree_asset_governance_only",
          "default_runtime_routing": false
        }
      },
      "scenario_source_plans": {
        "ato_login_anomaly": {
          "actions": [
            "login_logs_search",
            "archives_user_profile",
            "archives_user_analysis",
            "track_analysis_check_data_ready"
          ],
          "orchestration": "login_logs_search -> archives_user_profile -> archives_user_analysis -> track_analysis_check_data_ready",
          "boundary_flags": [
            "login_no_data_or_window_gap_not_ato_exclusion",
            "track_check_data_ready_not_risk_conclusion",
            "large_response_limited_enters_source_quality"
          ]
        },
        "abnormal_publish_content_handoff": {
          "actions": [
            "archives_photo_search",
            "archives_user_profile",
            "archives_user_analysis"
          ],
          "orchestration": "archives_photo_search -> archives_user_profile -> archives_user_analysis",
          "boundary_flags": [
            "photo_search_no_data_not_abnormal_publish_exclusion",
            "publish_chain_missing_evidence_must_be_explicit"
          ]
        },
        "account_spread_same_device": {
          "actions": [
            "archives_related_users",
            "archives_user_profile",
            "login_logs_search",
            "track_analysis_check_data_ready"
          ],
          "orchestration": "archives_related_users -> archives_user_profile/login_logs_search/track_analysis_check_data_ready",
          "boundary_flags": [
            "related_users_not_gang_conclusion",
            "same_device_relation_requires_cross_source_validation"
          ]
        },
        "rcp_event_attribution": {
          "actions": [
            "rcp_event_detail",
            "rcp_event_feature_list"
          ],
          "orchestration": "rcp_event_detail -> rcp_event_feature_list",
          "boundary_flags": [
            "event_detail_not_policy_tree_asset_lookup",
            "feature_list_partial_only_feature_group_summary",
            "strategy_hit_not_final_judgement"
          ]
        },
        "policy_asset_governance": {
          "actions": [
            "rcp_policy_tree_lookup"
          ],
          "orchestration": "rcp_policy_tree_lookup",
          "boundary_flags": [
            "policy_tree_asset_not_event_hit_path",
            "policy_tree_lookup_not_single_case_risk_evidence"
          ]
        }
      },
      "required_output_contract": [
        "source_plan",
        "actions",
        "source_quality_matrix",
        "missing_evidence",
        "evidence_strength",
        "final_answer_boundary"
      ],
      "source_quality_boundaries": {
        "no_data_not_risk_exclusion": true,
        "partial_observation_available_is_usable_partial": true,
        "large_response_limited_enters_source_quality": true,
        "archives_302_status": "auth_flow_not_completed_in_bound_context",
        "strategy_hit_not_final_judgement": true,
        "policy_tree_asset_not_event_hit_path": true,
        "track_check_data_ready_not_risk_conclusion": true
      },
      "field_boundary": {
        "risk_entity_identifier_allowed_internal": [
          "user_id",
          "device_id",
          "ip",
          "event_id",
          "strategy_id",
          "photo_id",
          "policyCode",
          "policyTreeCode"
        ],
        "forbidden_output_or_storage": [
          "cookie",
          "token",
          "session",
          "header",
          "authorization",
          "password",
          "full_phone",
          "id_card",
          "real_name",
          "detailed_address"
        ]
      }
    },
    "single_user_account_security": {
      "applies_to": [
        "single_user_account_security",
        "ATO",
        "ato_case_analysis",
        "login_anomaly"
      ],
      "entity_count": {
        "min": 1,
        "max": 1
      },
      "clean_full_runtime_source_policy": {
        "primary_access_method": "browser_backed_service",
        "fixed_actions_first": [
          "track_analysis_summary",
          "rcp_snapshot",
          "weapon_inventory",
          "login_logs_search"
        ],
        "old_runner_attempt_policy": "do_not_attempt_missing_sso_session_runner_or_track_analysis_runner_in_clean_full_runtime",
        "archives_stub_policy": "archives_profile_runner_stub_enters_missing_evidence_optional_source_gap_not_default_four_source_matrix_and_does_not_block_browser_backed_sources",
        "final_risk_judgement_made": false
      },
      "required_p0_sources": [
        {
          "source_name": "time_window_inference",
          "source_priority": "P0",
          "source_type": "planning_pre_step",
          "required": true,
          "anchor_sources": [
            "user_report_time",
            "archive_user_analysis_time",
            "audit_log_time",
            "publish_time",
            "publish_device_time",
            "strategy_hit_time",
            "login_event_time",
            "device_first_seen_time",
            "frontend_activity_time"
          ],
          "rule": "do_not_use_latest_7_days_as_only_window_when_event_time_missing"
        },
        {
          "source_name": "track_analysis_account_security_bundle",
          "source_priority": "P0",
          "source_type": "browser_backed_service",
          "access_method": "browser_backed_service",
          "browser_backed_action_name": "track_analysis_summary",
          "required": true,
          "typed_params_contract": {
            "user_id": "{userId}",
            "appName": "KUAISHOU",
            "mode": "account_security_bundle",
            "sub_interfaces": [
              "profile",
              "getUseDuration",
              "getDeviceIds",
              "getLastestDateTime"
            ]
          },
          "execution_contract": {
            "client_helper": "BrowserBackedServiceClient.call_account_security_sources",
            "expanded_sub_interface_calls_required": true,
            "single_call_with_sub_interfaces_list_is_plan_only_not_complete_bundle": true,
            "per_call_typed_params": {
              "mode": "account_security_bundle",
              "sub_interface": "profile|getUseDuration|getDeviceIds|getLastestDateTime",
              "sub_interfaces": [
                "{single_sub_interface}"
              ]
            },
            "merge_policy": "merge four standard track_analysis_summary results into one track_analysis_account_security_bundle source result"
          },
          "required_sub_interfaces": [
            "profile",
            "getUseDuration",
            "getDeviceIds",
            "getLastestDateTime"
          ],
          "output_summary": [
            "profile_card",
            "device_ids_summary",
            "daily_duration_summary",
            "latest_timestamp_summary",
            "event_day_activity_alignment_if_time_anchor_available"
          ],
          "fallback_status": "each_sub_interface_blocked_auth_failed_timeout_parse_error_enters_source_quality",
          "boundary": "frontend_activity_signal_not_final_judgement_no_data_parse_error_source_gap_not_risk_exclusion"
        },
        {
          "source_name": "rcp_strategy_hit_entry",
          "source_priority": "P0",
          "source_type": "browser_backed_service",
          "access_method": "browser_backed_service",
          "browser_backed_action_name": "rcp_snapshot",
          "required": true,
          "typed_params_contract": {
            "entity_type": "user_id",
            "entity_id": "{userId}",
            "mode": "account_security_strategy_event_entry"
          },
          "output_summary": [
            "event_count",
            "hit_policy_or_chaining_key_presence",
            "risk_decision_distribution_if_available"
          ],
          "fallback_status": "blocked_auth_failed_timeout_parse_error_enter_source_quality",
          "boundary": "strategy_event_entry_not_final_risk_judgement_no_hit_not_risk_exclusion"
        },
        {
          "source_name": "weapon_user_to_device_graph",
          "source_priority": "P0",
          "source_type": "browser_backed_service",
          "access_method": "browser_backed_service",
          "browser_backed_action_name": "weapon_inventory",
          "required": true,
          "required_path_contains": "/apiv2/graphData",
          "expected_query_shape": "product=KUAISHOU&productName=KUAISHOU&groupValue={userId}&groupKey=USER_ID&dimKey=DEVICE_ID&searchLevel=2",
          "typed_params_contract": {
            "user_id": "{userId}",
            "mode": "account_security_user_device_graph_with_conditional_riskData",
            "riskData_trigger_device_prefix": [
              "ANDROID_",
              "IOS_"
            ]
          },
          "riskData_execution_rule": "execute_riskData_only_when_graphData_retains_raw_ANDROID_or_IOS_device_id_checkpoint",
          "riskData_missing_rule": "raw_device_id_checkpoint_missing_enters_source_quality_not_completed_riskData",
          "riskData_chaining_allowed": true,
          "boundary": "graphData_no_device_not_no_risk_riskData_no_label_not_no_risk"
        },
        {
          "source_name": "user_login_unified_log",
          "source_priority": "P0",
          "source_type": "browser_backed_service",
          "access_method": "browser_backed_service",
          "browser_backed_action_name": "login_logs_search",
          "required": true,
          "typed_params_contract": {
            "user_id": "{userId}",
            "window": "last_7d",
            "recallSource": "2,0,1,3",
            "fallback_on_status": [
              "parse_error"
            ],
            "fallback_window": "last_24h"
          },
          "fallback_status": "login_logs_7d_parse_error_preserved_and_24h_fallback_added_as_standard_browser_backed_source_result",
          "boundary": "no_data_parse_error_timeout_blocked_are_source_quality_not_no_risk_evidence"
        }
      ],
      "optional_source_gaps": [
        {
          "source_name": "archives_profile_readonly",
          "source_priority": "optional",
          "source_type": "optional_controlled_runner",
          "access_method": "optional_controlled_runner_source_gap_when_stub",
          "runner_name": "archives_profile_runner",
          "readiness_status": "planned_or_minimal_stub",
          "live_runner_connected": false,
          "default_matrix_policy": "do_not_include_in_browser_backed_four_source_main_chain_when_stub",
          "evidence_card_location_when_stub": "missing_evidence.optional_source_gap",
          "fallback_status": "archives_profile_stub_source_gap",
          "boundary": "readonly_no_auth_repair_no_cookie_token_session_header_output_stub_gap_does_not_block_browser_backed_chain"
        }
      ],
      "conditional_sources": [
        {
          "source_name": "weapon_device_risk_if_device_id_available",
          "source_priority": "P0-conditional",
          "source_type": "realtime_readonly_api",
          "condition": "suspicious_device_id_from_graphData_or_login_log_or_publish_chain_or_track_analysis",
