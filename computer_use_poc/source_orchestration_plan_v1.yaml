{
  "schema_version": "source_orchestration_plan_v1",
  "plans": {
    "single_user_account_security": {
      "applies_to": [
        "single_user_account_security",
        "ATO",
        "ato_case_analysis",
        "login_anomaly"
      ],
      "entity_count": {
        "min": 1,
        "max": 1
      },
      "required_p0_sources": [
        {
          "source_name": "time_window_inference",
          "source_priority": "P0",
          "source_type": "planning_pre_step",
          "required": true,
          "anchor_sources": [
            "user_report_time",
            "archive_user_analysis_time",
            "audit_log_time",
            "publish_time",
            "publish_device_time",
            "strategy_hit_time",
            "login_event_time",
            "device_first_seen_time",
            "frontend_activity_time"
          ],
          "rule": "do_not_use_latest_7_days_as_only_window_when_event_time_missing"
        },
        {
          "source_name": "archives_profile_readonly",
          "source_priority": "P0",
          "source_type": "account_baseline",
          "access_method": "api_direct_if_available_or_browser_cookie_activation_or_same_origin_fetch",
          "runner_name": "archives_profile_runner",
          "readiness_status": "planned_or_minimal_stub",
          "required": true,
          "supported_input": "user_id",
          "purpose": "user_profile_account_status_ban_or_downrank_register_device_login_device_summary",
          "success_marker": "archives_profile_source_status=completed_when_homeInfo_available",
          "fallback_status": "archives_auth_gap_or_blocked_enters_source_quality",
          "boundary": "readonly_no_auth_repair_no_cookie_token_session_header_output_no_publish_device_id_means_no_publish_device_anomaly_judgement"
        },
        {
          "source_name": "user_login_unified_log",
          "source_priority": "P0",
          "source_type": "realtime_readonly_api",
          "required": true
        },
        {
          "source_name": "weapon_user_to_device_graph",
          "source_priority": "P0",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/apiv2/graphData",
          "expected_query_shape": "product=KUAISHOU&productName=KUAISHOU&groupValue={userId}&groupKey=USER_ID&dimKey=DEVICE_ID&searchLevel=2"
        },
        {
          "source_name": "track_analysis_getDeviceIds",
          "source_priority": "P0_or_P1_by_case",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/dp/platform/app/analytics/v2/sequence/getDeviceIds",
          "method": "POST"
        },
        {
          "source_name": "track_analysis_getUseDuration",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/dp/platform/app/analytics/v2/sequence/getUseDuration",
          "method": "POST",
          "expected_rows_shape": "object_array_date_duration"
        },
        {
          "source_name": "track_analysis_profile",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/dp/platform/app/analytics/v2/sequence/profile",
          "method": "POST",
          "expected_time_fields": "startTime/endTime_ms"
        }
      ],
      "conditional_sources": [
        {
          "source_name": "weapon_device_risk_if_device_id_available",
          "source_priority": "P0-conditional",
          "source_type": "realtime_readonly_api",
          "condition": "suspicious_device_id_from_graphData_or_login_log_or_publish_chain_or_track_analysis",
          "required": false,
          "required_path_contains": "/apiv2/riskData",
          "expected_query_shape": "product=KUAISHOU&deviceIds={deviceId}",
          "fallback_status": "missing_device_reference"
        },
        {
          "source_name": "publish_chain_if_abnormal_publish_or_content_operation",
          "source_priority": "P0-conditional",
          "readiness_status": "playbook_ready_not_runner_ready",
          "condition": "abnormal_publish_or_traffic_diversion_content_or_non_owner_publish_or_content_operation",
          "fields": [
            "publish_time",
            "publish_item_id",
            "content_type_summary",
            "publish_device",
            "publish_ip_or_region_if_available",
            "publish_source_chain"
          ],
          "future_source_name": "archives_publish_device_trace",
          "fallback_status": "not_connected_or_blocked_or_missing_evidence"
        },
        {
          "source_name": "tianshi_strategy_hit_if_user_asks_policy_hit",
          "source_priority": "P0-explicit",
          "readiness_status": "playbook_ready_not_runner_ready",
          "condition": "user_explicitly_asks_policy_hit_or_strategy_hit_auxiliary_judgement",
          "fallback_status": "runner_missing_or_missing_required_fields"
        },
        {
          "source_name": "archives_profile_if_auth_ready",
          "source_priority": "P0_duplicate_compatibility_alias",
          "condition": "archives_auth_ready",
          "fallback_status": "blocked_or_not_checked"
        },
        {
          "source_name": "tianshi_if_event_or_source_id_available",
          "condition": "event_id_or_source_id_available",
          "fallback_status": "missing_required_fields_or_not_checked"
        }
      ],
      "cross_source_rules": {
        "weapon_graphdata_empty_not_no_device": true,
        "allow_track_analysis_device_id_for_weapon_riskdata": true,
        "cross_source_device_id_marker_required": true
      },
      "stop_conditions": {
        "allow_stop_after_login_log_only": false,
        "allow_final_conclusion_without_source_completion_matrix": false,
        "allow_low_risk_from_no_data_only": false,
        "allow_skip_explicit_target_source": false,
        "allow_skip_archives_user_analysis_for_ato": false,
        "allow_skip_publish_chain_when_abnormal_publish": false
      },
      "source_completion_matrix_required_fields": [
        "source_name",
        "source_status",
        "source_quality",
        "evidence_time_range",
        "collected_at",
        "source_provenance",
        "redaction"
      ]
    }
  }
}
