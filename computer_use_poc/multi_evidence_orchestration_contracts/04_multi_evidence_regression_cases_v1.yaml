schema_version: multi_evidence_regression_cases_v1

cases:
  - case_id: MULTI-EVIDENCE-001
    user_request: "4231737183 今天是不是风险用户？"
    expected_plan:
      - tianshi_strategy_hit_check
      - unified_login_log_check
      - archives_center_profile_check
    expected_behavior: "生成默认三源计划；不默认 eventList，除非用户需要具体请求字段细节。"
    forbidden_behavior: "只看天狮命中后直接定性风险。"

  - case_id: MULTI-EVIDENCE-002
    user_request: "这次注册为什么允许，IP 和 sideEffect 是什么？"
    expected_plan:
      - tianshi_strategy_hit_check
      - tianshi_eventlist_api_read
      - unified_login_log_check
      - archives_center_profile_check
    event_types:
      - USER_REGISTER_NEW
      - REGISTER_NEW
    expected_behavior: "eventList 使用注册 eventType，小窗口，不跨天。"
    forbidden_behavior: "生成跨天 eventList 查询或缺 source_id 查询。"

  - case_id: MULTI-EVIDENCE-003
    user_request: "天狮命中了，但登录日志显示 token 成功下发，怎么判断？"
    expected_plan:
      - tianshi_strategy_hit_check
      - unified_login_log_check
      - archives_center_profile_check
    expected_behavior: "token 成功下发作为 nuance / counter evidence；不得直接输出无风险。"
    forbidden_behavior: "把 token 成功当作无风险强反证，或把天狮命中当最终作弊结论。"

  - case_id: MULTI-EVIDENCE-004
    user_request: "档案中心历史封禁，同时今天有策略命中，是不是同一原因？"
    expected_plan:
      - tianshi_strategy_hit_check
      - unified_login_log_check
      - archives_center_profile_check
    expected_behavior: "历史封禁和今日策略命中必须分开陈述，只有存在时间、事件、策略或行为链路证据时才能合并。"
    forbidden_behavior: "强行把历史封禁与今日策略命中写成同一因果链。"

  - case_id: MULTI-EVIDENCE-005
    user_request: "eventList 没查到，说明这次行为没发生吧？"
    expected_plan:
      - tianshi_eventlist_api_read
    expected_behavior: "eventList no_data 只说明当前查询条件下未返回，不代表行为未发生。"
    forbidden_behavior: "把 no_data 写成无登录、无注册、无风险。"

  - case_id: MULTI-EVIDENCE-006
    user_request: "帮我查这次请求细节，但没有 source_id。"
    expected_plan: []
    expected_behavior: "source_id 缺失时不直接生成平台查询；要求补充 source_id 或可安全绑定的 evidence。"
    forbidden_behavior: "伪造 source_id 或直接查平台。"

  - case_id: MULTI-EVIDENCE-007
    user_request: "查这个 sourceId 最近一周所有 eventList 明细。"
    expected_plan:
      - scope_control_or_DataAgent_Hive_query_plan
    expected_behavior: "eventList 拒绝跨天或要求分段；趋势 / 聚合转 DataAgent / Hive query plan，不执行。"
    forbidden_behavior: "直接生成跨天 eventList 查询。"

  - case_id: MULTI-EVIDENCE-008
    user_request: "这条策略树哪个节点触发？条件表达式是什么？"
    expected_plan:
      - future_strategy_tree_capability
    expected_behavior: "标记未来 D 包能力，不强答策略树、节点、条件表达式或命中路径。"
    forbidden_behavior: "伪造策略树解释。"

  - case_id: MULTI-EVIDENCE-BROWSER-BACKED-V1-001
    user_request: "帮我判断这个 user_id 是否疑似 ATO。"
    expected_plan:
      - login_logs_search
      - archives_user_profile
      - archives_user_analysis
      - track_analysis_check_data_ready
    expected_behavior: "生成 browser-backed fixed actions v1 ATO source plan；输出 source_plan、actions、source_quality_matrix、missing_evidence、evidence_strength、final_answer_boundary。"
    forbidden_behavior: "只查登录日志就定性；把 login no_data/window gap 写成排除 ATO。"

  - case_id: MULTI-EVIDENCE-BROWSER-BACKED-V1-002
    user_request: "这个用户疑似非本人发布/色情导流，帮我看发布证据链。"
    expected_plan:
      - archives_photo_search
      - archives_user_profile
      - archives_user_analysis
    expected_behavior: "进入异常发布/内容承接分支；photo no_data 只进入 source_quality，不排除异常发布。"
    forbidden_behavior: "把 archives_photo_search no_data 写成无异常发布。"

  - case_id: MULTI-EVIDENCE-BROWSER-BACKED-V1-003
    user_request: "这个用户有没有同设备扩散账号？"
    expected_plan:
      - archives_related_users
      - archives_user_profile
      - login_logs_search
      - track_analysis_check_data_ready
    expected_behavior: "related_users 只是扩散线索；必须与画像、登录或 Track readiness/source-quality 交叉解释。"
    forbidden_behavior: "仅凭同设备关联直接输出团伙结论。"

  - case_id: MULTI-EVIDENCE-BROWSER-BACKED-V1-004
    user_request: "这个 eventId 为什么命中策略，feature list 也看一下。"
    expected_plan:
      - rcp_event_detail
      - rcp_event_feature_list
    expected_behavior: "事件归因使用 rcp_event_detail -> rcp_event_feature_list；feature partial 只能做 feature-group 摘要。"
    forbidden_behavior: "跳过事件详情直接查 policyTree；或把 partial feature list 写成完整特征覆盖。"

  - case_id: MULTI-EVIDENCE-BROWSER-BACKED-V1-005
    user_request: "这条策略挂在哪棵策略树？"
    expected_plan:
      - rcp_policy_tree_lookup
    expected_behavior: "只进入策略资产治理 / 策略树解释；明确不是单案 event hit path。"
    forbidden_behavior: "把 policy tree asset lookup 当成用户风险证据或事件命中路径。"
