schema_version: source_executability_inventory_v1
scope: full_runtime_local_inventory
inventory_mode: local_files_only_no_platform_call
generated_for_runtime_mode: full_runtime
global_boundaries:
  no_real_platform_access: true
  no_dataagent_hive_call: true
  no_cookie_header_manual_auth: true
  no_sso_runner_debug: true
  no_cloud_config_change: true
  no_package_or_git_submit: true
  source_failure_not_no_risk: true
  dataagent_hive_per_call_authorization_required: true

sources:
  - source_name: tianshi_strategy_hit
    capability: strategy_hit_read
    priority: P0-explicit
    expected_runtime_mode: conditional
    playbook_file:
      - computer_use_poc/platform_call_playbook_index.md
      - computer_use_poc/tianshi_strategy_hit_readonly_poc_v2_5_5.md
      - computer_use_poc/tianshi_strategy_hit_routing_v2_5_6.md
      - computer_use_poc/tianshi_rcp_runner_contract_v1.md
      - computer_use_poc/tianshi_strategy_platform_contracts/02_fast_query_hbase_strategy_hit_contract_v1.md
    runner_file: bin/tianshi_rcp_runner
    runner_present: true
    runner_included_in_full_runtime: true
    required_inputs:
      - user_id_or_source_id
      - bounded_time_range
    allowed_actions:
      - tianshi.fastQueryHbase
      - strategy_hit_overview_lookup
    forbidden_actions:
      - strategy_hit_as_final_ato_judgement
      - raw_response_dump
      - arbitrary_url_probe
      - auth_debug
      - manual_cookie_header
    auth_dependency:
      - future_live_readonly_adapter_disabled_by_default
      - no_auth_dependency_in_dry_run_contract_check
    current_status: dry_run_contract_ready
    failure_policy:
      - source_status=dry_run_only_for_local_contract_check
      - explicit_source_failure_must_enter_source_quality
      - no_data_not_risk_exclusion
      - dry_run_only_not_platform_evidence
    fallback_policy:
      - do_not_silently_skip_explicit_source
      - output_partial_evidence_card
      - use_query_plan_if_required_fields_missing_or_live_mode_disabled
    evidence_output_fields:
      - source_status
      - records_count
      - hit_policy_summary
      - policy_code_summary
      - risk_decision_summary
      - event_type_summary
      - time_range
      - source_quality
      - missing_required_fields
    sensitive_output_policy: redact_source_id_policy_payload_and_operator
    notes:
      - "Full runtime has a tianshi_rcp_runner dry-run/contract-check scaffold. It does not perform live readonly verification."
      - "544963630-style strategy-hit questions should route to the runner and report dry_run_only/source_quality until live readonly mode is explicitly verified."

  - source_name: rcp_event_list
    capability: tianshi_eventlist_read
    priority: P0-explicit_or_conditional
    expected_runtime_mode: conditional
    playbook_file:
      - computer_use_poc/platform_call_playbook_index.md
      - computer_use_poc/tianshi_eventlist_api_read_poc_v2_5_9.md
      - computer_use_poc/tianshi_rcp_runner_contract_v1.md
      - computer_use_poc/platform_access/tianshi_rcp_api_contract_v0_1.yaml
      - computer_use_poc/tianshi_strategy_platform_contracts/03_eventlist_api_read_event_detail_contract_v1.md
    runner_file: bin/tianshi_rcp_runner
    runner_present: true
    runner_included_in_full_runtime: true
    required_inputs:
      - event_type_or_source_condition
      - bounded_time_range
      - source_id_or_event_context
    allowed_actions:
      - rcp.eventList
      - rcp.rcpEventDetail_when_upstream_event_id_available
      - rcp.featureList_when_upstream_event_context_available
    forbidden_actions:
      - guessed_request_body_as_verified
      - user_id_direct_event_detail
      - arbitrary_url_probe
      - raw_response_dump
      - auth_debug
    auth_dependency:
      - future_live_readonly_adapter_disabled_by_default
      - no_auth_dependency_in_dry_run_contract_check
    current_status: dry_run_contract_ready
    failure_policy:
      - missing_upstream_id_enters_source_quality
      - timeout_not_no_data
      - no_data_not_behavior_absence
      - dry_run_only_not_platform_evidence
    fallback_policy:
      - output_query_plan_or_partial_evidence_when_live_mode_disabled
      - fastQueryHbase_is_fallback_optional_not_blocker
    evidence_output_fields:
      - source_status
      - records_count
      - event_count_summary
      - representative_event_refs
      - policy_code_refs
      - time_range
      - source_quality
      - failure_layer
    sensitive_output_policy: mask_event_source_policy_request_payload
    notes:
      - "RCP eventList now has a tianshi_rcp_runner dry-run/contract-check scaffold. It is not live verified."

