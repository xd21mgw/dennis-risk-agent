      - bounded_time_range_optional
    allowed_actions:
      - login_logs_search
    forbidden_actions:
      - curl_cookie
      - manual_cookie_header
      - auth_bridge_debug
      - sso_session_runner_execution_in_clean_full_runtime
      - unbounded_history_query
      - raw_token_output
    auth_dependency:
      - browser_backed_service_handles_auth_boundary
      - dennis_client_must_not_read_auth_material
    current_status: adapter_dry_run_ready
    failure_policy:
      - auth_failed_or_blocked_enters_source_quality
      - login_log_window_incomplete_when_over_online_window
      - no_data_not_risk_exclusion
    fallback_policy:
