{
  "policy_version": "security_preflight_policy_v1",
  "default_decision": "deny",
  "global_denied_requested_fields": [
    "cookie",
    "token",
    "session",
    "storageState",
    "authorization",
    "raw_header",
    "raw_headers",
    "system_prompt",
    "routing_prompt",
    "skill_prompt",
    "arbitrary_url",
    "arbitrary_api",
    "arbitrary_js",
    "raw_sql",
    "shell_command",
    "full_json",
    "raw_response",
    "raw_result"
  ],
  "global_redacted_fields": [
    "phone",
    "mobile",
    "ip",
    "device_id",
    "did",
    "user_id",
    "user_agent",
    "log_content",
    "requestParam",
    "extraParam"
  ],
  "risk_entity_identifier_policy": {
    "internal_risk_review_raw_allowed_when_minimum_necessary": [
      "user_id",
      "uid",
      "device_id",
      "did",
      "ip",
      "event_id",
      "source_id",
      "strategy_id",
      "photo_id",
      "policyCode",
      "policyTreeCode"
    ],
    "external_share_requires_masking": true,
    "credential_secret_always_forbidden": [
      "cookie",
      "token",
      "session",
      "header",
      "authorization",
      "password"
    ],
    "strict_pii_always_forbidden_raw": [
      "full_phone",
      "id_card",
      "real_name",
      "detailed_address"
    ]
  },
  "dangerous_scopes": [
    "batch",
    "expansion",
    "multi_entity",
    "cross_platform",
    "multi_hop_expansion",
    "export",
    "write",
    "mutation",
    "system_modification"
  ],
  "capabilities": {
    "user_to_device_resolution": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_user_id", "bounded_time_context_optional"],
      "denied_inputs": ["bulk_user_list_without_approval", "arbitrary_graph_expansion"],
      "max_default_scope": "single_user_top_candidates",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["many_users", "multi_hop_expansion", "too_many_candidates"],
      "denied_requested_fields": ["raw_graph_payload", "full_relation_dump"],
      "redacted_fields": ["device_id", "did", "relation_detail"],
      "audit_required": true,
      "current_status": "registered_readonly"
    },
    "device_to_user_resolution": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_device_id"],
      "denied_inputs": ["bulk_device_list_without_approval", "multi_hop_expansion"],
      "max_default_scope": "single_device_direct_users",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["many_devices", "multi_hop_expansion", "sensitive_user_details_requested"],
      "denied_requested_fields": ["raw_graph_payload", "full_user_dump"],
      "redacted_fields": ["user_id", "relation_detail", "risk_tags"],
      "audit_required": true,
      "current_status": "registered_readonly"
    },
    "device_risk_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_device_id"],
      "denied_inputs": ["location_query_by_default", "bulk_device_export", "raw_device_fingerprint_output"],
      "max_default_scope": "single_device_risk_summary",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["many_devices", "raw_fingerprint_requested", "location_requested"],
      "denied_requested_fields": ["raw_device_fingerprint", "location", "precise_location"],
      "redacted_fields": ["device_id", "did", "ip", "app_list"],
      "audit_required": true,
      "current_status": "registered_readonly"
    },
    "user_profile_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_user_id"],
      "denied_inputs": ["bulk_user_export", "raw_personal_info_output"],
      "max_default_scope": "single_user_profile_summary",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["many_users", "sensitive_identity_fields_requested"],
      "denied_requested_fields": ["raw_personal_info", "id_card", "full_phone"],
      "redacted_fields": ["user_id", "phone", "ip", "device_id", "operator_account"],
      "audit_required": true,
      "current_status": "registered_readonly"
    },
    "login_log_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_user_id_or_single_did", "bounded_time_range"],
      "denied_inputs": ["raw_token_output", "unbounded_history_query", "bulk_user_query"],
      "max_default_scope": "single_entity_reliable_window",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["over_reliable_window", "many_users", "raw_log_content_requested"],
      "denied_requested_fields": ["token", "session", "authorization", "cookie", "raw_log_content", "full_json"],
      "redacted_fields": ["user_id", "device_id", "did", "phone", "ip", "user_agent", "log_content"],
      "audit_required": true,
      "current_status": "registered_readonly"
    },
    "strategy_hit_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_source_id", "bounded_time_range"],
      "denied_inputs": ["raw_response_dump", "batch_source_ids_without_approval"],
      "max_default_scope": "single_source_bounded_window",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["many_source_ids", "raw_event_detail_requested", "long_time_window"],
      "denied_requested_fields": ["raw_response", "full_json", "internal_trace"],
      "redacted_fields": ["source_id", "request_payload", "sample_hits"],
      "audit_required": true,
      "current_status": "registered_readonly"
    },
    "frontend_activity_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["single_user_id_or_device_id"],
      "denied_inputs": ["raw_event_sequence_by_default", "behavior_replay_export"],
      "max_default_scope": "profile_top_area_summary",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["event_sequence_requested", "many_entities"],
      "denied_requested_fields": ["behavior_replay_export", "raw_event_params"],
      "redacted_fields": ["user_id", "device_id", "usage_detail", "screenshot_path"],
      "audit_required": true,
      "current_status": "limited_or_design_only"
    },
    "api_direct_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["registered_endpoint", "registered_payload_shape", "bounded_scope"],
      "denied_inputs": ["arbitrary_url", "arbitrary_api", "raw_header_export", "credential_export"],
      "max_default_scope": "registered_single_entity_read",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["new_endpoint", "many_entities", "raw_json_requested"],
      "denied_requested_fields": ["arbitrary_url", "arbitrary_api", "cookie", "token", "session", "raw_header", "raw_headers", "full_json", "raw_response"],
      "redacted_fields": ["registered_endpoint", "requestParam", "extraParam", "user_id", "device_id", "ip"],
      "audit_required": true,
      "current_status": "registered_readonly_only"
    },
    "browser_dom_read": {
      "mode": "readonly",
      "capability_level": "readonly_sensitive",
      "allowed_inputs": ["registered_page_module", "scoped_selector", "readonly_extract"],
      "denied_inputs": ["arbitrary_js", "localStorage_dump", "cookie_read", "mutation_clicks"],
      "max_default_scope": "registered_page_module_read",
      "max_entity_count_without_approval": 1,
      "batch_allowed": false,
      "approval_required_if": ["new_page_module", "broad_snapshot", "sensitive_raw_text_requested"],
      "denied_requested_fields": ["arbitrary_js", "localStorage", "cookie", "storageState", "mutation_click"],
      "redacted_fields": ["operator_account", "page_sensitive_text", "token_like_values"],
      "audit_required": true,
      "current_status": "registered_readonly_only"
    },
    "write_or_mutation": {
      "mode": "write",
      "capability_level": "write_or_mutation",
      "allowed_inputs": [],
      "denied_inputs": ["any"],
      "max_default_scope": "none",
      "max_entity_count_without_approval": 0,
      "batch_allowed": false,
      "approval_required_if": [],
      "denied_requested_fields": ["any"],
      "redacted_fields": [],
      "audit_required": true,
      "current_status": "prohibited"
    },
    "system_or_logic_modification": {
      "mode": "system",
      "capability_level": "system_or_logic_modification",
      "allowed_inputs": [],
      "denied_inputs": ["any"],
      "max_default_scope": "none",
      "max_entity_count_without_approval": 0,
      "batch_allowed": false,
      "approval_required_if": [],
      "denied_requested_fields": ["any"],
      "redacted_fields": [],
      "audit_required": true,
      "current_status": "prohibited"
    }
  }
}
