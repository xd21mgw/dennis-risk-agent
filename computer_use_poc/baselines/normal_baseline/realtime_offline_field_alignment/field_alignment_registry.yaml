role_rules:
  result_signal:
    exact_last_parts:
      - risk_decision
      - riskDecision
      - risk_score
      - riskScore
      - riskLevel
      - risk_label
      - riskLabel
      - policyHit
      - policy_hit
      - policyCode
      - policy_code
      - riskDecision
      - modelDecision
      - model_decision
      - machineAccount
      - highRisk
      - hitStrategy
      - weaponRiskScore
    source_aware_last_parts:
      action:
        allowed_prefixes: [tianshi_rcp., rcp_event., rcp_, strategy., enforcement., punish.]
      result:
        allowed_prefixes: [tianshi_rcp., rcp_event., enforcement.]
      decision:
        allowed_prefixes: [tianshi_rcp., rcp_event., risk., model.]
  identifier_anchor:
    exact_last_parts:
      - did
      - device_id
      - deviceId
      - device_id_str
      - deviceIdStr
      - xm1
      - xm3
      - xm
      - trace_id
      - traceId
      - session_id
      - sessionId
      - token
      - access_token
      - accessToken
      - refresh_token
      - refreshToken
      - idfa
      - idfv
      - imei
      - oaid
      - android_id
      - androidId
      - uuid
      - guid
      - user_id
      - userId
      - photo_id
      - photoId
      - event_id
      - eventId
      - request_id
      - requestId
      - source_id
      - sourceId
    substrings: [_id, _token, Token]
  one_risk_factual_labels:
    - noSim
    - oneRiskNoSim
    - oneRiskNoSimCardIos
    - oneRiskNoPasswordIos
    - factoryReset
    - root
    - isRoot
    - emulator
    - isEmulator
    - hook
    - frida
    - xposed
    - oneRiskLaunchLess10
    - launchLess10
    - oneRiskBatteryZero
    - batteryZero
