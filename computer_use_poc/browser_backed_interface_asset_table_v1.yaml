schema_version: browser_backed_interface_asset_table_v1
status: phase1_contract_only
source_of_truth:
  service_action_registry: /Users/pengcheng/dennis-local/browser-backed-api-poc/ACTION_REGISTRY.md
  service_actions_file: /Users/pengcheng/dennis-local/browser-backed-api-poc/src/actions.js
  service_mock_tests: /Users/pengcheng/dennis-local/browser-backed-api-poc/test/mock.test.js
interface_count: 74
business_naming_rule: "Business orchestration calls service actions and inventory rows interfaces."
default_boundaries:
  default_runtime_routing: false
  no_cartesian_execution: true
  no_data_skipped_timeout_missing_contract_not_counter_evidence: true
  service_passthrough_only: true
  dennis_owns_observation_source_quality_and_evidence: true
  credential_material_output_forbidden: true
default_cap_policy:
  max_l1_interfaces_per_entity: 6
  max_l2_interfaces_per_anchor_type: 2
  max_anchor_items_per_domain: 5
  max_relation_expansion_depth: 1
  max_relation_entities_per_edge_type: 20
stop_reason_policy_allowed:
  - cap_reached
  - missing_anchor
  - missing_contract
  - skipped_unavailable_action
  - source_timeout
  - source_no_data_not_counter_evidence
  - low_value_anchor
  - duplicate_anchor
  - authorization_required
  - no_new_evidence_after_round
  - service_contract_gap
  - parse_error
interfaces:
  - interface_name: track_analysis_summary
    observation_domain: [behavior_domain]
    default_call_role: first_hop_candidate
    required_anchor: [user_id_or_device_id, appName]
    possible_outputs: [base_summary_card, candidate_anchor_pool, frontend_activity_anchor]
    cap_policy: one_summary_per_seed_entity
    stop_reason_policy: [missing_anchor, source_timeout, parse_error]
    prohibited_usage: "Do not treat frontend activity summary as final risk judgement."
    status: registered
    notes: "Open default Track sequence summary facade."
  - interface_name: login_logs_search
    observation_domain: [behavior_domain, network_domain]
    default_call_role: first_hop_candidate
    required_anchor: [user_id, time_window]
    possible_outputs: [base_summary_card, candidate_anchor_pool, login_control_chain_anchor, network_anchor]
    cap_policy: "Use max_records/window cap; json_array_capped rows are partial."
    stop_reason_policy: [cap_reached, source_no_data_not_counter_evidence, source_timeout, parse_error]
    prohibited_usage: "Do not treat no_data, byte_limit, or response_too_large as low-risk counter-evidence."
    status: registered
    notes: "Supports structured capped body at data.logSearchModels."
  - interface_name: weapon_inventory
    observation_domain: [device_domain, group_domain]
    default_call_role: first_hop_candidate
    required_anchor: [user_id_or_device_id]
    possible_outputs: [base_summary_card, candidate_anchor_pool, relation_expansion_result, group_profile_candidate]
    cap_policy: "Limit device ids and graph edges; no unbounded graph expansion."
    stop_reason_policy: [cap_reached, missing_anchor, source_timeout, service_contract_gap]
    prohibited_usage: "Same-device relation is not a gang conclusion by itself; do not use this as the primary device-detail field source when weapon_device_info is available."
    status: registered
    notes: "Service-owned graphData -> riskData follow-up. Primary role is user-device graph / relation discovery; direct device details use weapon_device_info."
  - interface_name: weapon_device_info
    observation_domain: [device_domain]
    default_call_role: anchor_triggered_drilldown
    required_anchor: [device_id]
    possible_outputs: [drilldown_evidence_card, device_detail_table, device_field_commonality, candidate_features]
    cap_policy: "Top-K selected device anchors only; no all-device detail fanout."
    stop_reason_policy: [missing_anchor, source_no_data_not_counter_evidence, source_timeout, parse_error, service_contract_gap]
    prohibited_usage: "Do not call without a current-task device_id anchor; device detail fields are candidate evidence, not final judgement."
    status: registered
    notes: "Direct Weapon riskData device detail. Shared Android/iOS action; output fields differ by platform."
