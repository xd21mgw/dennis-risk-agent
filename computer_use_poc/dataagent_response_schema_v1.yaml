schema_version: dataagent_response_schema_v1
purpose: Normalized DataAgent response shape for Dennis full_runtime.

raw_step_types:
  - MODEL_THINKING
  - TOOL_CALL
  - MODEL_ANSWER
  - AGENT_END

evidence_extraction_rule:
  model_answer_only: true
  model_thinking_is_evidence: false
  tool_call_raw_is_evidence: false
  agent_end_metadata_only: true
  supported_live_step_paths:
    - steps[].subType
    - data.steps[].subType
    - data.steps[].data.stepData.subType
  supported_live_content_paths:
    - steps[].content
    - data.steps[].content
    - data.steps[].data.stepData.componentInfo.props.content

normalized_response:
  request_id:
    type: string
    required: false
  session_id:
    type: string
    required: false
  query_id:
    type: string
    required: false
  status:
    type: string
    required: true
    allowed:
      - pending
      - running
      - completed
      - failed
      - timeout
      - no_data
      - permission_denied
      - sql_generated
      - parse_error
      - source_schema_drift
  model_answer_source:
    type: string
    required: true
    allowed:
      - model_answer_step
      - content_fallback
      - answer_field
      - missing
  generated_sql:
    type: string
    required: false
    sensitive_field_policy: redact_sensitive_columns
  generated_sql_source:
    type: string
    required: false
    allowed:
      - MODEL_ANSWER
      - TOOL_CALL_PROVENANCE_ONLY
  result_rows:
    type: list[object]
    required: true
    sensitive_field_policy: drop_sensitive_columns
  columns:
    type: list[string]
    required: true
    sensitive_field_policy: drop_sensitive_columns
  row_count:
    type: integer
    required: true
  error_message:
    type: string
    required: false
    sensitive_field_policy: redact_sensitive_terms
  permission_status:
    type: string
    required: true
    allowed:
      - not_started
      - ok
      - permission_denied
      - unknown
  data_freshness:
    type: string
    required: false
  source_tables:
    type: list[string]
    required: true
  query_time_range:
    type: object
    required: false
  warnings:
    type: list[string]
    required: true
  no_data_reason:
    type: string
    required: false
  trace_id:
    type: string
    required: false
  tool_call_provenance:
    type: object
    required: false
    evidence_boundary: provenance_only_not_business_conclusion
    fields:
      query_id:
        type: string
        required: false
      trace_id:
        type: string
        required: false
      generated_sql:
        type: string
        required: false
      source_tables:
        type: list[string]
        required: false
      provenance_only_not_business_conclusion:
        type: boolean
        required: true
  source_quality:
    type: object
    required: true
    fields:
      source_name: dataagent_hive
      source_status:
        allowed:
          - pending
          - running
          - completed
          - failed
          - timeout
          - no_data
          - permission_denied
          - sql_generated
          - parse_error
          - source_schema_drift
      permission_status:
      response_type:
      reliability_level:
      failure_reason:
      no_data_not_risk_exclusion: true
      pending_execution_not_evidence:
      dataagent_api_attempted:
        meaning: true when the runner attempted to call the DataAgent API path.
      http_request_sent:
        meaning: true when an HTTP request was actually sent; read timeout keeps this true.
      step_response_received:
        meaning: true only when step-based JSON was received and accepted for normalization.
      model_answer_extracted:
        meaning: true only when MODEL_ANSWER content was extracted.
      model_answer_source:
        allowed:
          - model_answer_step
          - content_fallback
          - answer_field
          - missing
      dataagent_called:
        meaning: legacy compatibility alias; do not use as a substitute for step_response_received.
      hive_called:
        expected_for_dry_run: false
      dry_run:
      sql_submitted:
        expected_for_dry_run: false

source_observation_compatibility:
  source_card:
    required: true
    fields:
      source_name: dataagent_hive
      source_status:
      evidence_summary:
      records_count:
  source_quality:
    required: true
  source_checkpoint_private:
    required: true
    fields:
      raw_references: []
      downstream_source_chaining: []
  redaction:
    required: true
    fields:
      redaction_applied: true
      sensitive_output: false

sensitive_field_policy:
  blocked_field_patterns:
    - phone
    - cookie
    - token
    - session
    - header
    - authorization
    - password
    - email
    - id_card
  behavior:
    generated_sql: redact_identifier_or_literal
    result_rows: drop_column_or_mask_value
    error_message: redact_sensitive_terms
    warnings: report_blocked_count_without_plaintext

status_boundary:
  sql_generated:
    meaning: SQL or query plan exists but no DataAgent/Hive result has been executed.
    evidence_allowed: false
  no_data:
    meaning: DataAgent/Hive returned no rows for the bounded query.
    no_risk_evidence: false
  pending:
    evidence_allowed: false
  running:
    evidence_allowed: false
  failed:
    evidence_allowed: false
  timeout:
    evidence_allowed: false
  permission_denied:
    evidence_allowed: false
  parse_error:
    meaning: Response content existed but could not be normalized into supported evidence.
    evidence_allowed: false
  source_schema_drift:
    meaning: HTTP response shape did not expose MODEL_ANSWER or supported fallback content.
    evidence_allowed: false

response_shape_probe:
  purpose: Sanitized envelope-shape inspection for live dry-run response schema drift.
  raw_response_body_output: false
  fields:
    http_status:
    content_type:
    top_level_type:
    top_level_keys:
      sensitive_key_policy: redact_sensitive_key_names
    candidate_paths:
    step_like_array_paths:
    observed_type_fields:
    observed_subtype_fields:
    possible_model_answer_paths:
    possible_tool_call_paths:
      sql_policy: present_boolean_only
      query_id_policy: present_boolean_only
      trace_id_policy: present_boolean_only
    text_field_paths_with_lengths_only:
      value_policy: length_only_no_text
    sql_field_paths_present_only:
      value_policy: present_boolean_only_no_sql
    query_id_paths_present_only:
      value_policy: present_boolean_only_no_query_id
    trace_id_paths_present_only:
      value_policy: present_boolean_only_no_trace_id
    response_size_bytes:
  forbidden_output:
    - raw_response_body
    - raw_sql
    - raw_query_id
    - raw_trace_id
    - cookie
    - token
    - session
    - header
