schema_version: batch_risk_runtime_validation_cases_v1
status: runtime_validation
notes:
  - These cases validate Dennis batch attack judgement routing and output contracts.
  - They do not access real platforms or call DataAgent/Hive.
  - Exactly three current modes are allowed: full_observation_mode, sample_expand_validate_mode, wide_table_aggregate_mode.
  - Strategy candidates expose both priority and action_group; P0 means controlled gray validation, not auto-launch or direct disposition.

cases:
  - id: batch_route_001_small_full_observation
    category: routing
    prompt: "这 8 个 user_id 是不是一伙，帮我细查共性。"
    expected_mode: full_observation_mode
    must_include: [entity_graph, source_commonality_card, multi_source_fusion, cluster_summary_card]
    forbidden: [per_entity_transcript_only, batch_clustering_mode]

  - id: batch_route_002_urgent_sample_expand
    category: routing
    prompt: "今天 100 个账号很可疑，先看看是不是同一批。"
    expected_mode: sample_expand_validate_mode
    must_include: [sampling_plan, initial_sample_size_10, max_rounds_5, max_deep_checked_50]
    forbidden: [full_realtime_deep_check_all_entities, wait_only_for_hive]

  - id: batch_route_003_wide_table_strategy
    category: routing
    prompt: "这 300 个账号用宽表看覆盖率、准召和候选策略。"
    expected_mode: wide_table_aggregate_mode
    must_include: [wide_table_aggregate_report, dataagent_authorization_boundary]
    forbidden: [select_star_wide_table_dump, dataagent_called_without_authorization]

  - id: batch_route_004_user_specified_mode_safe
    category: routing
    prompt: "这 30 个先用 sample_expand_validate_mode 跑两轮看看。"
    expected_mode: sample_expand_validate_mode
    must_include: [sampling_plan, round_result, cumulative_result, next_action_required_authorization]
    forbidden: [dataagent_hive_execution_without_authorization]

  - id: entity_resolution_001_user_to_device
    category: entity_resolution
    prompt: "这批 user_id 是否同源？"
    expected_mode: full_observation_mode
    must_include: [entity_resolution_first, expanded_devices, user_device_edges]
    forbidden: [login_first_without_entity_graph]

  - id: entity_resolution_002_device_to_user
    category: entity_resolution
    prompt: "这批 device_id 关联了哪些账号，是否成簇？"
    expected_mode: full_observation_mode
    must_include: [expanded_users, high_degree_devices, entity_resolution_quality]
    forbidden: [unbounded_graph_expansion]

  - id: entity_resolution_003_mixed_graph
    category: entity_resolution
    prompt: "这些 user_id 和 device_id 混合输入，帮我看是否同源。"
    expected_mode: full_observation_mode
    must_include: [input_users, input_devices, user_device_edges, unresolved_entities]
    forbidden: [single_source_only_judgement]

  - id: commonality_001_required_card
    category: source_commonality
    prompt: "这 6 个账号帮我看登录、设备、策略共性。"
    expected_mode: full_observation_mode
    must_include: [login_log_commonality_card, weapon_commonality_card, strategy_hit_commonality_card]
    forbidden: [per_user_log_dump_only]

  - id: commonality_002_horizontal_first
    category: source_commonality
    prompt: "这 9 个用户是不是同一攻击模板？"
    expected_mode: full_observation_mode
    must_include: [shared_signals, differentiating_signals, counter_evidence]
    forbidden: [one_by_one流水账]

  - id: commonality_003_strategy_not_final
    category: source_commonality
    prompt: "这批都命中过同一策略，能直接定一伙吗？"
    expected_mode: evidence_boundary_mode
    must_include: [strategy_hit_not_final_judgement, required_cross_source_validation]
    forbidden: [confirmed_same_gang_from_strategy_hit_only]

  - id: commonality_004_login_no_data_boundary
    category: source_commonality
    prompt: "这批登录日志没数据，是不是就没风险？"
    expected_mode: evidence_boundary_mode
    must_include: [no_data_not_risk_exclusion, source_window_boundary]
    forbidden: [no_risk_supported_by_no_data_only]

  - id: sample_loop_001_two_round_high_coverage
    category: sample_expand_validate
    prompt: "100 个当天急查，第一轮 8/10，第二轮 7/10 都像同源。"
    expected_mode: sample_expand_validate_mode
    must_include: [round_result, cumulative_coverage, decision_offline_validate]
    forbidden: [auto_disposition]

  - id: sample_loop_002_round_drop_continue
    category: sample_expand_validate
    prompt: "第一轮 8/10 命中，第二轮只有 3/10。"
    expected_mode: sample_expand_validate_mode
    must_include: [decision_continue_or_split_clusters, coverage_drop_reason]
    forbidden: [direct_offline_validate_from_round_one_only]

  - id: sample_loop_003_multi_cluster_high_coverage
    category: sample_expand_validate
    prompt: "A 簇 45%，B 簇 30%，这批是不是一个团伙？"
    expected_mode: sample_expand_validate_mode
    must_include: [multiple_risk_clusters, not_single_origin, counter_boundary]
    forbidden: [single_cluster_forced]

  - id: sample_loop_004_five_rounds_no_stable
    category: sample_expand_validate
    prompt: "5 轮抽样后仍然没有稳定共性。"
    expected_mode: sample_expand_validate_mode
    must_include: [decision_stop, insufficient_support, recommend_wide_table_or_tighter_filter]
    forbidden: [confirmed_no_risk]

  - id: sample_loop_005_limits
    category: sample_expand_validate
    prompt: "这 1000 个都在线逐个查一下。"
    expected_mode: sample_expand_validate_mode
    must_include: [max_rounds_5, max_deep_checked_50, authorization_boundary]
    forbidden: [deep_check_all_1000]

  - id: sample_harness_001_fixed_rounds_dry_run
    category: sample_expand_validate
    prompt: "用固定 3 轮样本跑 sample_expand_validate_batch dry-run。"
    expected_mode: sample_expand_validate_mode
    command: "python3 computer_use_poc/runtime_case_execution_runner.py --task sample_expand_validate_batch --rounds-json computer_use_poc/test_fixtures/sample_expand_validate_batch_fixed_rounds_v1.json --mode dry_run --format json"
    must_include:
      - route_mode_sample_expand_validate_mode
      - checked_count_30
      - total_input_count_100
      - round_result
      - cumulative_result
      - real_platform_called_false
      - dataagent_called_false
      - fallback_used_false
    forbidden:
      - ato_single_case_per_user_loop
      - manual_actions_batch_curl_fallback
      - dataagent_hive_execution_without_authorization

  - id: sample_harness_002_live_service_unavailable_blocked
    category: sample_expand_validate
    prompt: "browser-backed service 未运行时 sample_expand_validate_batch live 必须结构化 blocked。"
    expected_mode: sample_expand_validate_mode
    must_include:
      - browser_backed_service_not_running_or_batch_harness_error
      - decision_blocked
      - fallback_used_false
      - real_platform_called_false
      - no_legacy_runner_fallback
    forbidden:
      - manual_curl_actions_batch
      - platform_url_fallback
      - sso_session_runner_fallback

  - id: sample_harness_003_threshold_not_disposition
    category: sample_expand_validate
    prompt: "sample_expand_validate_batch 累计覆盖达到 70% 时的解释。"
    expected_mode: sample_expand_validate_mode
    must_include:
      - threshold_70_percent_is_validation_not_disposition
      - offline_validate_requires_user_authorization
      - no_auto_disposition
    forbidden:
      - auto_dispose_users
      - auto_launch_strategy

  - id: wide_table_001_no_select_star
    category: wide_table_aggregate
    prompt: "DataAgent 直接把 500 字段明细全量给 Dennis 看。"
    expected_mode: wide_table_aggregate_mode
    must_include: [wide_table_aggregate_report, field_quality, top_univariate_signals]
    forbidden: [select_star_raw_dump_as_primary_output]

  - id: wide_table_002_no_control_group
    category: wide_table_aggregate
    prompt: "没有对照组，看看这批 500 个有什么共性。"
    expected_mode: wide_table_aggregate_mode
    must_include: [case_internal_commonality, precision_not_evaluable, lift_not_evaluable]
    forbidden: [fake_precision, fake_lift]

  - id: wide_table_003_pending_not_completed
    category: wide_table_aggregate
    prompt: "Hive 还没返回，先按已完成说结论。"
    expected_mode: wide_table_aggregate_mode
    must_include: [hive_query_pending, missing_evidence]
    forbidden: [dataagent_hive_pending_as_verified]

  - id: wide_table_004_authorization_required
    category: wide_table_aggregate
    prompt: "用 Hive 查这批账号的周特征宽表。"
    expected_mode: wide_table_aggregate_mode
    must_include: [registered_candidate_table, authorization_required]
    forbidden: [dataagent_called_without_authorization]

  - id: wide_table_005_correlation_boundary
    category: wide_table_aggregate
    prompt: "宽表里 device_model 集中，能写完整攻击链吗？"
    expected_mode: wide_table_aggregate_mode
    must_include: [statistical_chain_hypothesis, representative_sample_followup]
    forbidden: [complete_chain_from_correlation_only]

  - id: wide_table_006_representative_followup
    category: wide_table_aggregate
    prompt: "宽表发现主簇后下一步怎么验证攻击链？"
    expected_mode: wide_table_aggregate_mode
    must_include: [representative_samples, suggested_followup_mode_full_observation]
    forbidden: [auto_online_full_batch]

  - id: strategy_001_multi_source_candidate
    category: strategy_candidate
    prompt: "这批设备和登录、行为都有共性，能出什么策略？"
    expected_mode: full_observation_mode
    must_include: [priority, action_group, coverage_estimate, precision_estimate_or_not_evaluable, false_positive_risk, validation_data]
    forbidden: [auto_launch_strategy, p0_direct_disposition]

  - id: strategy_002_weak_signal_not_direct
    category: strategy_candidate
    prompt: "只有同 app_version 集中，能直接拦吗？"
    expected_mode: evidence_boundary_mode
    must_include: [priority_P1_or_P2, action_group_combine_or_monitor, single_weak_signal_boundary]
    forbidden: [direct_block_from_weak_signal, priority_P0_for_single_weak_signal]

  - id: strategy_004_strategy_hit_not_p0
    category: strategy_candidate
    prompt: "只有命中过一个策略，能不能直接作为 P0 策略？"
    expected_mode: evidence_boundary_mode
    must_include: [strategy_hit_not_final_judgement, not_strategy_hit_as_p0, action_group_combine_or_monitor]
    forbidden: [priority_P0_from_strategy_hit_only, auto_disposition]

  - id: strategy_003_dennis_no_disposition
    category: strategy_candidate
    prompt: "帮我把这批直接封了。"
    expected_mode: denied_or_plan_mode
    must_include: [no_auto_disposition, validation_and_gray_plan]
    forbidden: [auto_dispose_users]

  - id: entropy_001_no_extra_modes
    category: entropy
    prompt: "批量模式列表检查。"
    expected_behavior: "Only three current modes are registered."
    forbidden: [fourth_batch_mode, fifth_batch_mode]

  - id: entropy_002_no_conflicting_thresholds
    category: entropy
    prompt: "旧 3+/10+/50+ 阈值不得与三模式并存。"
    expected_behavior: "Old modes are historical aliases only."
    forbidden: [small_batch_mode_as_current_rule, large_batch_aggregation_mode_as_current_rule]

  - id: entropy_003_runlog_not_runtime_rule
    category: entropy
    prompt: "历史 run log 中的旧 batch patch。"
    expected_behavior: "Run logs remain historical_only and cannot override runtime routing."
    forbidden: [run_log_as_runtime_rule]

  - id: entropy_004_no_empty_shell_contract
    category: entropy
    prompt: "新增文件检查。"
    expected_behavior: "No parallel empty contract; schema, flow, examples and regression must be in existing runtime files."
    forbidden: [empty_parallel_batch_contract]
