schema_version: archives_center_contract_v0_1
platform_key: archives_center
capability_status: same_origin_api_confirmed_if_auth_ready
current_status: partial
role:
  - account_baseline_p0_for_ato
  - publish_chain_p0_conditional_for_abnormal_publish
confirmed_entry: https://admin.p.adm-corp.kuaishou.com
login_redirect_domain: account.p.adm-corp.kuaishou.com
preflight_status:
  latest_live_validation: completed
  profile_reachable: true
  publish_chain_visible: true
  activation_required_in_latest_validation: false
  recoverable_preflight: completed
entry:
  preferred_spa_entry: /frontend/archives/index.html#/archives/user/profile?userId={userId}
  wrong_entry_example: /admin/search/user?keyword={userId}
  wrong_entry_behavior: amc_or_ip_blocked
source_priority:
  archives_profile_readonly: P0
  archives_publish_chain: P0_conditional_for_abnormal_publish
invocation_methods:
  - browser_same_origin
  - browser_readonly
  - recoverable_preflight
activation_account_identifier_rules:
  current_user_account_identifier: environment_or_current_conversation_value
  dennis_environment_example: muguangwu
  do_not_hardcode_for_other_users: true
  if_prefilled: reuse_prefilled_value
  if_empty: fill_account_identifier_if_empty
  next_step: click_next_or_continue_once
  pause_for_manual_action:
    - QR
    - MFA
    - password
    - captcha
    - sms
  manual_action_context_boundary:
    business_case_execution: "do_not_wait; source_status=user_manual_action_required; continue partial evidence"
    recoverable_preflight: "do_not_wait; source_status=user_manual_action_required; continue partial evidence"
    dedicated_auth_activation_task: "short_wait_allowed_for_user_manual_action"
  permission_page_status: permission_blocked
  loop_status: activation_loop_detected
profile_api:
  source_name: archives_profile_readonly
  invocation_method: browser_same_origin
  current_status: partial_existing_run_log_confirmed
  latest_live_validation_status: profile_reachable
  known_paths:
    - /archives/user/home/info
    - /archives/user/home/getUserLabel
    - /archives/user/home/getUserShopInfo
    - /archives/draco/getPunishStatus
    - /archives/user/search/device
  input:
    required:
      - user_id
  output:
    - user_profile_summary
    - account_status_summary
    - ban_info_summary
    - demote_info_summary
    - register_info_summary
    - login_device_summary
    - register_device_summary
  account_baseline_fields:
    - userId
    - username
    - account_status
    - registration_info
    - real_name_or_identity_status_if_visible
    - login_device_summary_if_visible
  boundaries:
    - "Readonly only."
    - "Business cases do not perform live auth repair."
    - "auth not ready becomes archives_auth_gap or auth_session_issue."
    - "ATO single case keeps Archives user analysis as P0 even when same-origin/browser access is required."
    - "profile_reachable=true can mark account baseline source completed."
publish_chain:
  source_name: archives_publish_chain
  invocation_method: browser_same_origin
  current_status: partial_from_archives_inventory_and_run_logs
  latest_live_validation_status: publish_chain_visible
  latest_live_validation_observed_count: 7
  known_paths:
    - /v4/archives/report/photo/search
    - /archives/photo/home/userAutonomy
    - /v4/archives/gallery/live/list
    - /archives/user/gallery/momentList
    - /archives/photo/collection/getCollectionList
    - /archives/user/search/device
  trigger:
    - abnormal_publish
    - traffic_diversion_content
    - non_owner_publish
    - content_operation
  output:
    - publish_work_list
    - photoId_or_videoId
    - publish_time_or_upload_time
    - play_count
    - comment_count
    - like_count
    - collect_count
    - status
    - publish_device_if_visible
    - publish_source_if_visible
  tab_interaction:
    affected_ui:
      - .ks-tabs__item
      - "Archives Center 视频作品集 tab"
    click_ref_limitation: "agent-browser click @ref may not trigger Vue/ks-tabs switch"
    fallback_sequence:
      - try_accessible_click_once
      - if_selected_state_not_changed_use_dom_eval_click
      - if_still_failed_try_url_hash_or_route_navigation_if_contract_exists
      - if_still_failed_mark_tab_switch_failed_not_source_unavailable
  boundaries:
    - "No publish_device_id means no publish-device abnormality judgement."
    - "Publish time is a P0 time anchor."
    - "Publish device can trigger Weapon riskData and track-analysis event-day alignment."
    - "publish_chain_visible=true can mark abnormal publish P0-conditional source completed."
    - "publish_device not visible becomes missing_evidence, not publish_chain unavailable."
    - "tab_switch_failed is not source unavailable."
audit_and_punishment:
  source_name: archives_audit_punishment_reason
  role: time_window_inference_source
  current_status: partial
  known_paths:
    - /archives/user/home/auditLog
    - /archives/draco/getLabelLog
    - /v4/audit/user/fourinfo/log/search
    - /archives/draco/getPunishStatus
  output:
    - reason
    - audit_time
    - punishment_time
    - action_type
  boundaries:
    - "reason / audit_time / punishment_time are time anchors only."
    - "Reason cannot independently classify ATO."
    - "If exact API path or required parameter is missing, mark source_contract=partial and missing_upstream_id."
source_quality_rules:
  - "profile_reachable=true can mark account baseline source completed."
  - "publish_chain_visible=true can mark abnormal publish P0-conditional source completed."
  - "publish_device not visible becomes missing_evidence; do not mark publish_chain unavailable."
  - "timeout becomes archives_browser_timeout, not auth_failed."
  - "wrong entry blocked by AMC/IP does not mean the preferred SPA entry is unavailable."
  - "preferred_spa_entry_required when an unregistered Archives entry is attempted."
  - "tab_switch_failed is a UI interaction gap, not platform unavailable."
forbidden:
  - "Do not output cookie/token/session/header/password."
  - "Do not guess archives domains."
  - "Do not click login page inside business cases."
  - "Do not hardcode Dennis environment account identifier for other users."
