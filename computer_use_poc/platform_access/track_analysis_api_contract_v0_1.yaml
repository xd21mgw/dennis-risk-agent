track_analysis_event_day_alignment:
  purpose:
    - "Determine whether the event day has real frontend activity."
    - "Identify mismatch between backend login/publish/strategy-hit and frontend activity."
    - "Support protocol login, token/session use, or non-real-client behavior investigation."
  event_day_anchors:
    - login_success_day
    - scan_or_oauth_day
    - device_switch_day
    - strategy_hit_day
    - publish_work_day
    - abnormal_behavior_day
  evidence_rule:
    - "If backend login/publish/strategy-hit exists but same-day userId/deviceId duration is 0 or absent, mark front_backend_activity_mismatch."
    - "front_backend_activity_mismatch is a medium/high-value lead but cannot independently classify risk."
    - "track-analysis no_data or duration=0 is not no-risk evidence; interpret with appName, window, and entity dimension."
  output_required:
    - appName
    - entity_type
    - date_range
    - total_duration
    - peak_day
    - event_day_duration
    - active_days_bucket
    - register_time
    - fan_distribution
    - caveats
boundaries:
  - "KUAISHOU and NEBULA must be interpreted separately."
  - "NEBULA duration=0 means no observed NEBULA activity, not account no activity."
  - "Event-day duration=0 during backend login/scan/publish/strategy-hit day becomes front_backend_activity_mismatch."
  - "completed_zero_duration is a source_quality state, not a no-risk conclusion."
  - "SPA reachable but API not verified is discovery_completed_api_probe_pending, not completed."
  - "Activity evidence is auxiliary and not final ATO/protocol/group-control judgement."
