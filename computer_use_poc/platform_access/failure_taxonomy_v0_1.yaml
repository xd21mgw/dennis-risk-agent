schema_version: platform_access_failure_taxonomy_v0_1
core_principles:
  - "先判调用链路，再判认证"
  - "先判参数契约，再判权限"
  - "先判局部 API，再判平台不可用"
taxonomy:
  runner_invocation_error:
    layer: runner_invocation
    meaning: "Runner was called with the wrong binary, argument shape, cwd, or wrapper path."
    not_equivalent_to: auth_failed
  runner_dependency_error:
    layer: runner_dependency
    meaning: "Runner dependency such as requests/uv/runtime package is missing or failed before platform request."
    not_equivalent_to: permission_blocked
  runner_platform_not_supported:
    layer: runner_invocation
    meaning: "Runner does not support selected platform/action."
  wrong_base_domain:
    layer: platform_contract
    meaning: "API base domain does not match the confirmed contract, e.g. RCP eventList should use rcp.corp.kuaishou.com."
  same_origin_mismatch:
    layer: same_origin_context
    meaning: "Browser context is not on the required origin for same-origin fetch."
  same_origin_required:
    layer: same_origin_context
    meaning: "API contract requires browser same-origin context instead of direct runner call."
  invalid_parameter:
    layer: parameter_contract
    meaning: "Required parameter shape is invalid."
  parameter_contract_missing:
    layer: parameter_contract
    meaning: "The contract for required query/body params is incomplete or not followed; classify before auth."
    known_error_codes:
      track_analysis_getLastestDateTime_604: "Missing or invalid getLastestDateTime product/type/funcType/_t parameter contract."
  missing_required_param:
    layer: parameter_contract
    meaning: "A required query/body parameter is absent, for example track-analysis getLastestDateTime missing product/type/funcType."
  wrong_entity_type:
    layer: parameter_contract
    meaning: "Input entity type is wrong, e.g. userId used as deviceId for riskData."
  missing_upstream_id:
    layer: upstream_dependency
    meaning: "Downstream API is not triggered because eventId/policyCode/policyVersion/deviceId/queryTime is missing."
  api_path_permission_blocked:
    layer: path_permission
    meaning: "Specific API path is blocked; do not generalize to whole platform unavailable."
  platform_partial_available:
    layer: platform_partial
    meaning: "Some APIs or fields are available while other paths are blocked or incomplete."
  sso_auth_failed:
    layer: auth_session
    meaning: "True SSO/session failure after invocation and parameter contract are valid."
  accessproxy_session_invalid:
    layer: auth_session
    meaning: "Access proxy redirect or session invalid state."
  user_manual_action_required:
    layer: user_action_required
    meaning: "QR/MFA/password/captcha/SMS step requires user action; business flows and recoverable preflight must not wait."
    boundary: "Only dedicated auth activation task may briefly wait; business flow continues partial evidence."
  amc_permission_blocked:
    layer: path_permission
    meaning: "AMC/path permission block, often UI-path specific."
  wrong_entry_amc_blocked_not_platform_unavailable:
    layer: path_permission
    meaning: "An unregistered Archives entry path is blocked by AMC/IP rules; this does not prove the preferred SPA entry is unavailable."
    boundary: "Retry only via registered preferred SPA entry or mark source gap."
  preferred_spa_entry_required:
    layer: platform_contract
    meaning: "Archives Center access must use the registered SPA entry instead of an admin/search or guessed path."
  archives_browser_timeout:
    layer: timeout
    meaning: "Archives browser or same-origin source exceeded budget."
    boundary: "Not auth_failed and not no-risk evidence."
  tab_switch_failed:
    layer: browser_ui_interaction
    meaning: "SPA tab switch did not complete after allowed click/eval/route attempts."
    boundary: "Does not mean source unavailable."
  publish_chain_missing:
    layer: missing_evidence
    meaning: "Publish-chain tab or fields were not visible or not extracted under current source conditions."
    boundary: "Do not infer no abnormal publish."
  user_permission_missing:
    layer: user_permission
    meaning: "Current user lacks platform permission."
  parse_error:
    layer: parser
    meaning: "Response could not be parsed as expected schema."
  timeout:
    layer: timeout
    meaning: "Source did not finish in budget; not counter evidence."
  query_window_too_large:
    layer: query_window
    meaning: "Realtime API query window is too broad for smoke or quick validation, e.g. RCP eventList seven-day query."
    boundary: "Shard, paginate, use fallback/comparison source, or produce an offline plan; do not mark completed_no_hit."
  realtime_query_timeout:
    layer: timeout
    meaning: "Realtime quick-query API timed out due to query size, window, or server latency."
    boundary: "Not no-hit evidence and not no-risk evidence."
  extraction_timeout_after_response:
    layer: extraction_timeout
    meaning: "JSON response was received, but client-side extraction or deep parsing exceeded budget."
    boundary: "Preserve response receipt metadata and mark extraction timeout; do not convert to completed_no_hit."
  completed_no_data:
    layer: no_failure
    meaning: "Valid request and schema; no records under current filter/window."
    boundary: "Not a no-risk conclusion."
  completed_zero_duration:
    layer: no_failure
    meaning: "Valid activity request returned zero duration for the selected app/entity/window."
    boundary: "Not a no-risk conclusion; may be front/back-end mismatch when a backend event exists on that day."
  completed_no_hit:
    layer: no_failure
    meaning: "Valid strategy/event query; no hit under current filter/window."
    boundary: "Not a no-risk conclusion."
  completed_no_hit_for_small_window:
    layer: no_failure
    meaning: "Valid realtime strategy/event query over a small smoke window returned empty data.eventList."
    boundary: "Only says no hit in that small window; not no-risk evidence."
  discovery_completed_api_probe_pending:
    layer: platform_partial
    meaning: "UI/browser discovery completed but API execution is not yet verified."
    boundary: "Do not mark the source completed."
  front_backend_activity_mismatch:
    layer: no_failure
    meaning: "Backend login/publish/strategy event exists but same-day frontend duration is zero or absent."
    boundary: "Medium/high-value lead only; not standalone final judgement."
classification_order:
  - runner_invocation
  - runner_dependency
  - platform_contract
  - parameter_contract
  - upstream_dependency
  - same_origin_context
  - browser_ui_interaction
  - path_permission
  - auth_session
  - user_action_required
  - user_permission
  - parser
  - query_window
  - timeout
  - extraction_timeout
  - platform_partial
  - missing_evidence
