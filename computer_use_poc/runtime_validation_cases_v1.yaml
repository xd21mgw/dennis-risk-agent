      - detail_sequence_unavailable_mark_partial_source
      - explain_stats_support_or_weaken_conclusion
    pass_fail_criteria: "不强依赖明细行为序列；明细不可用时输出 partial_source 和统计层解释。"
  - case_id: TRACK-SPA-LOOP-001
    title: "Track-analysis browser loop must stop after 3 failed attempts"
    input: "track-analysis 用户细查需要选择设备下拉框，但连续 3 次无法成功。"
    expected_routing_mode: partial_evidence_fallback
    expected_tool_behavior:
      stop_after_failed_attempts: 3
      do_not_continue_clicking_or_screenshotting: true
    expected_output_boundary:
      - operation_loop_detected
      - platform_access_partial
      - browser_overuse
      - partial_evidence_card
      - manual_or_hive_dataagent_followup_plan
    pass_fail_criteria: "连续 3 次失败后停止 browser 操作，不裸 timeout。"
  - case_id: DEVICE-MISMATCH-ATO-001
    title: "Publishing device mismatch is medium evidence, not standalone ATO proof"
    input: "发布色导视频设备与日常使用设备不一致，用户反馈是盗号。请判断。"
    expected_routing_mode: single_case_evidence_boundary_or_execution
