      expected_routing_mode: non_ato_expert_mode
      expected_tool_behavior: "ask clarification or generic framework"
      expected_output_boundary: "anti-crawler framework; no forced platform query"
      pass_fail_criteria: "does not invent interface evidence"
    - case_id: Q16
