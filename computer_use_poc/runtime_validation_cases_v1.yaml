    pass_fail_criteria: "发现 WEB 登录 / WEB 发布 / 导流视频时，自动查登录链路 + 发布审计 + 设备/IP/UA/session + 历史发布基线。"
  - case_id: ATO-PUBLISH-VIDEO-ANCHOR-001
    input: "用户被盗后疑似发导流视频。"
    expected_output_boundary:
      - query_recent_video_or_publish_action_chain
      - extract_photo_id
      - extract_publish_time_source_device_ip_ua
      - extract_four_items_if_available
      - align_publish_action_with_login_logs
    pass_fail_criteria: "必须查询视频 / 发布动作链路，提取 photo_id、发布时间、发布来源、发布设备、IP/UA、四项信息，并与登录日志对齐。"
  - case_id: ATO-COMMON-DEVICE-ID-SPOOFING-001
    input: "登录日志中 device_id 是用户历史常用设备，但 device_model / os / UA / IP 异常。"
    expected_output_boundary:
      - device_identity_consistency_required
      - possible_device_id_spoofing
      - device_identity_inconsistency
      - common_device_id_not_sufficient_to_exclude_ato
    pass_fail_criteria: "不得判定为常用设备安全；必须标记 possible_device_id_spoofing / device_identity_inconsistency。"
  - case_id: ATO-DEVICE-ID-NOT-SOLE-IDENTITY-001
    input: "ATO 单案只拿到 device_id。"
    expected_output_boundary:
      - device_id_not_sole_identity
      - require_device_model_os_ua_ip_login_source_login_type
      - require_historical_baseline_comparison
      - no_conclusion_from_device_id_only
    pass_fail_criteria: "必须继续补机型、系统、UA、IP、登录端、登录方式、历史基线，不能只基于 device_id 下结论。"
  - case_id: ATO-COMMON-DEVICE-NOT-EXCLUSION-001
    input: "候选设备 ID 历史常用，但异常窗口有 WEB 发布导流视频。"
    expected_output_boundary:
      - common_device_id_not_sufficient_to_exclude_ato
      - content_action_deep_dive_required
      - device_identity_consistency_required
      - session_or_token_takeover_suspicion_preserved
    pass_fail_criteria: "常用 device_id 不能作为排除 ATO 的强反证，必须结合设备身份一致性和内容动作链路判断。"
  - case_id: TRACK-NOT-PROOF-OF-OWNER-001
    input: "Track 有活跃。"
    expected_output_boundary:
      - track_activity_present_not_owner_proof
      - track_auxiliary_only
      - no_ato_exclusion_from_track_activity
    pass_fail_criteria: "不得说本人操作；Track 只能作为辅助活跃信号。"
  - case_id: TRACK-BACKEND-MISMATCH-001
    input: "后端 WEB 发布存在但 Track 当天无前端活跃。"
    expected_output_boundary:
      - front_backend_activity_mismatch
      - protocol_or_session_api_control_suspicion
      - not_standalone_final_judgement
    pass_fail_criteria: "标记 front_backend_activity_mismatch，可作为 WEB/session/API/另一控制端线索，但不单独定性。"
  - case_id: LOGIN-RESPONSE-TOO-LARGE-NOT-EVIDENCE-001
    input: "login_logs_search response_too_large。"
    expected_output_boundary:
      - response_too_large_not_login_evidence
      - source_contract_gap
      - login_log_evidence_unusable
      - no_login_volume_inference
    pass_fail_criteria: "response_too_large 只能表示 wrapper 无法解析 / 传输，不得解释成登录很多或登录无异常。"
  - case_id: LOGIN-UI-NODATA-WRAPPER-LARGE-MISMATCH-001
    input: "人工 UI 无数据，wrapper response_too_large。"
    expected_output_boundary:
      - wrapper_response_mismatch
      - source_contract_gap
      - actual_ui_no_data_unverified_by_wrapper
      - login_log_evidence_unusable
    pass_fail_criteria: "必须标记 wrapper_response_mismatch，登录日志证据不可用；不得把 wrapper 结果作为 completed login evidence。"
  - case_id: ATO-LOGIN-HIVE-REGISTRY-FIRST-001
    input: "在线登录日志不可用或窗口不足。"
    expected_output_boundary:
      - account_security_hive_source_registry_read_first
      - recommended_table_present
      - partition_filters_present
      - key_fields_present
      - no_free_table_guessing
      - dataagent_requires_per_call_authorization
    pass_fail_criteria: "生成 Hive query plan 时必须使用已登记账号安全常用表，不得自由猜表；真实调用仍需用户逐次授权。"
  - case_id: USER-FACING-NO-ROUTING-METADATA-001
    input: "ATO 单案业务答复、partial evidence card、本地修复完成报告、Codex final summary style answer。"
    expected_output_boundary:
      - no_routing_metadata_in_user_body
      - no_source_quality_yaml_in_user_body
      - no_boundary_flags_in_user_body
      - no_debug_or_validator_yaml_in_user_body
      - business_evidence_card_template
      - partial_evidence_card_uses_natural_language_source_quality_summary
      - local_patch_completion_report_no_runtime_yaml_by_default
      - codex_final_summary_no_runtime_yaml_by_default
      - routing_metadata_allowed_only_internal_debug_validation_or_explicit_user_request
      - answer_gate_fails_when_user_facing_text_contains_routing_metadata_colon
    pass_fail_criteria: "默认用户正文不得包含 routing_metadata/source_quality YAML/boundary_flags/execution_mode/validator 过程字段；覆盖 ATO 单案、partial evidence card、本地修复完成报告和 Codex final summary。只有 internal observation log、validation fixture、debug 模式或用户明确要求内部过程字段时才允许完整 metadata。"
  - case_id: SOURCE-PLAN-NOT-FLAT-SOURCE-SUMMARY-001
    input: "ATO 单案。"
    expected_output_boundary:
      - suspicious_anchor_derived_from_realtime_p0_sources
      - archives_photo_search_default_p0
      - candidate_control_endpoint_extraction
      - device_identity_consistency
      - content_action_or_login_control_chain
      - historical_baseline_comparison
      - not_flat_track_rcp_weapon_login_archive_summary
    pass_fail_criteria: "不能只按 Track/RCP/Weapon/Login/Archive 平铺 source 状态，必须围绕 anchor/control-chain/action-chain/baseline 输出。"
  - case_id: BATCH-ATO-CLUSTER-LENS-REQUIRED-001
    input: "已有内容相似 / 策略命中分簇的一批账号。"
    expected_output_boundary:
      - existing_cluster_signal_collection
      - ato_cluster_lens
      - existing_cluster_plus_ato_lens
      - not_content_or_strategy_cluster_only
    pass_fail_criteria: "必须额外检查 ATO cluster lens，不能只停留在内容或策略簇解释。"
  - case_id: BATCH-ATO-WEB-UNTRUSTED-LOGIN-CLUSTER-001
    input: "多个账号都存在 WEB 非可信登录，并在短时间内发布导流视频。"
    expected_output_boundary:
      - web_untrusted_login_cluster
      - login_to_action_delta
      - compromised_account_cluster
      - high_suspected_ato_cluster
    pass_fail_criteria: "识别 compromised_account_cluster / high_suspected_ato_cluster，而不是只归到内容导流簇或策略命中簇。"
  - case_id: BATCH-ATO-EXISTING-CLUSTER-PLUS-ATO-LENS-001
    input: "已有内容相似分簇，同时存在 WEB 非可信登录共性。"
    expected_output_boundary:
      - content_similarity_cluster_preserved
      - existing_cluster_plus_ato_lens
      - content_diversion_cluster_plus_ato_suspicion
    pass_fail_criteria: "保留内容相似簇解释，同时叠加 ATO lens，输出内容导流簇 + ATO 盗号投放嫌疑。"
  - case_id: BATCH-ATO-DEVICE-ID-SPOOFING-CLUSTER-LENS-001
    input: "多账号 device_id 看似常用，但 UA / 机型 / IP / 登录端异常。"
    expected_output_boundary:
      - device_identity_inconsistency_cluster
      - possible_device_id_spoofing
      - common_device_id_not_sufficient_to_exclude_ato
    pass_fail_criteria: "识别 possible_device_id_spoofing cluster，不得用常用 device_id 降低 ATO 置信度。"
  - case_id: BATCH-ATO-LOGIN-TO-ACTION-DELTA-001
    input: "多个账号 WEB 登录后 0-30 分钟内发视频 / 评论 / 直播。"
    expected_output_boundary:
      - login_to_action_delta
      - login_to_action_cluster
      - downstream_action_time_alignment
    pass_fail_criteria: "提取 login_to_action_delta，并作为 ATO lens 核心特征。"
  - case_id: BATCH-ATO-CONTENT-ACTION-DEEP-DIVE-001
    input: "批量账号存在发视频、直播、评论、私信导流。"
    expected_output_boundary:
      - content_action_deep_dive
      - extract_photo_id_live_id_comment_id
      - extract_publish_source_device_ip_ua
      - extract_four_items_if_available
    pass_fail_criteria: "必须进入 content_action_deep_dive，提取内容 ID、发布时间、发布来源、发布设备、IP/UA、四项信息。"
  - case_id: BATCH-ATO-REPRESENTATIVE-CASE-SELECTION-001
    input: "批量中存在多个疑似 ATO 簇。"
    expected_output_boundary:
      - representative_case_selection
      - high_suspicion_samples
      - boundary_sample
      - counter_example_sample
      - no_full_per_user_for_loop
    pass_fail_criteria: "每簇抽代表样本做单案深挖，不全量逐个深挖，也不跳过单案机制证明。"
  - case_id: BATCH-ATO-REPRESENTATIVE-DEEP-DIVE-BACKFILL-001
    input: "代表样本证明 device_identity_inconsistency。"
    expected_output_boundary:
      - representative_ato_single_case_deep_dive
      - cluster_level_backfill
      - coverage_similarity_confidence
      - source_quality_missing_evidence_coverage
    pass_fail_criteria: "把该特征回填到簇级 coverage / similarity / confidence，而不是停留在单案结论。"
  - case_id: BATCH-ATO-MIXED-CLUSTER-001
    input: "同一批里既有盗号投放，也有垃圾注册投放。"
    expected_output_boundary:
      - mixed_cluster
      - compromised_account_cluster
      - content_abuse_only_cluster
      - separate_subcluster_explanations
    pass_fail_criteria: "输出 mixed_cluster，分别解释不同子簇，不做单一归因。"
  - case_id: BATCH-ATO-COMMON-DEVICE-NOT-EXCLUSION-001
    input: "多账号候选 device_id 是历史常用，但登录端 / UA / IP / 机型异常。"
    expected_output_boundary:
      - common_device_id_not_sufficient_to_exclude_ato
      - device_identity_consistency_required
      - device_identity_inconsistency_cluster
    pass_fail_criteria: "常用 device_id 不作为排除 ATO 的强反证。"
  - case_id: BATCH-ATO-TRACK-NOT-OWNER-PROOF-001
    input: "批量账号 Track 有活跃。"
    expected_output_boundary:
      - track_activity_not_owner_proof
      - track_auxiliary_only
      - no_batch_low_risk_from_track
    pass_fail_criteria: "Track 只能作为辅助，不能证明本人，也不能作为批量低风险反证。"
  - case_id: BATCH-ATO-LOGIN-NODATA-NOT-LOW-RISK-001
    input: "在线登录日志 no_data / response_too_large / wrapper mismatch。"
    expected_output_boundary:
      - source_gap
      - hive_required_if_long_window
      - response_too_large_not_login_evidence
      - no_low_risk_from_login_gap
    pass_fail_criteria: "标记 source gap / Hive required，不得输出低风险。"
  - case_id: BATCH-ATO-HIVE-REGISTRY-FIRST-001
    input: "批量在线登录日志不足。"
    expected_output_boundary:
      - account_security_hive_source_registry_read_first
      - hive_registry_first_query_plan
      - no_free_table_guessing
      - no_actual_dataagent_hive_call
    pass_fail_criteria: "生成基于已有账号安全 Hive registry 的 query plan，不自由猜表，不实际调用 Hive。"
  - case_id: BATCH-ATO-REPRESENTATIVE-NOT-GLOBAL-PROOF-001
    input: "代表样本支持 ATO。"
    expected_output_boundary:
      - representative_sample_not_global_proof
      - coverage_similarity_required
      - counter_examples_required
      - cluster_level_confidence_not_global_truth
    pass_fail_criteria: "只能证明该簇存在 ATO 模式，不能默认全批账号都被盗；需要按相似度、覆盖率和反例回填。"
  - case_id: BATCH-USER-FACING-NO-ROUTING-METADATA-001
    input: "批量 ATO partial conclusion。"
    expected_output_boundary:
      - no_routing_metadata_in_user_body
      - no_source_quality_yaml_in_user_body
      - no_boundary_flags_in_user_body
      - no_debug_or_validator_fields
      - batch_ato_business_template
    pass_fail_criteria: "批量 ATO 用户正文不得输出 routing metadata/source quality YAML/boundary flags/debug fields。"
  - case_id: ATO-REALTIME-SOURCE-INCOMPLETE-HIVE-REQUIRED-001
    input: "ATO 单案，统一登录日志 7 天外不可见。"
    expected_output_boundary:
      - login_log_window_incomplete
      - hive_required_hint
      - offline_hive_required
      - account_security_hive_source_registry_read_first
      - no_ato_exclusion_from_realtime_gap
    pass_fail_criteria: "实时源无法覆盖完整控制链时，必须在用户正文证据缺口 / 下一步补证中强提醒 Hive 长周期补证，不得排除 ATO。"
  - case_id: ATO-ADMIN-APP-LOG-ONLY-GAP-001
    input: "admin 只有 APP 日志，但风险动作是 WEB 发视频。"
    expected_output_boundary:
      - admin_app_log_only_gap
      - web_control_chain_missing
      - offline_hive_required
      - content_action_chain_required
      - no_low_risk_from_app_log_only
    pass_fail_criteria: "admin APP 日志不能覆盖 WEB/H5/PC/token/OAuth/扫码控制链；WEB 发视频风险动作必须提示 Hive 和发布动作链路补证。"
  - case_id: ATO-LOGIN-NODATA-NOT-EXCLUSION-HIVE-001
    input: "在线登录日志 no_data。"
    expected_output_boundary:
      - no_data_not_risk_exclusion
      - login_log_window_incomplete_if_window_gap
      - offline_hive_required_if_window_incomplete
      - no_low_risk_from_online_login_nodata
    pass_fail_criteria: "在线登录日志 no_data 不得输出低风险；若窗口不完整，必须提示 Hive 长周期补证。"
  - case_id: BATCH-ATO-HIVE-REQUIRED-WHEN-REALTIME-INCOMPLETE-001
    input: "批量导流视频 + 部分 WEB 非可信登录，但实时登录源不完整。"
    expected_output_boundary:
      - ato_cluster_lens
      - login_log_window_incomplete
      - admin_app_log_only_gap
      - web_control_chain_missing
      - offline_hive_required
      - hive_registry_first_query_plan
      - no_global_batch_ato_conclusion
    pass_fail_criteria: "批量 ATO 实时登录源不完整时，输出 Hive registry-first 补证计划，不默认定性全批。"
  - case_id: PASSTHROUGH-NO-NORMALIZED-OBSERVATION-DENNIS-QUALITY-001
    input: "browser-backed service envelope 不含 normalized_observation。"
    expected_output_boundary:
      - pure_passthrough_envelope_required
      - service_normalized_observation_not_required
      - dennis_generates_observation_from_passthrough
      - dennis_generates_source_quality_matrix
    pass_fail_criteria: "Dennis 必须从 passthrough envelope / transport metadata 生成 source quality，不依赖 service normalized_observation。"
  - case_id: PASSTHROUGH-NO-EVIDENCE-CARD-INPUTS-DENNIS-EVIDENCE-001
    input: "service envelope 不含 evidence_card_inputs。"
    expected_output_boundary:
      - service_evidence_card_inputs_not_required
      - dennis_generates_evidence_card
      - completed_or_partial_passthrough_enters_dennis_evidence_card
    pass_fail_criteria: "Dennis 必须自行选择 completed / partial passthrough observation 进入 evidence card。"
  - case_id: PASSTHROUGH-BATCH-TRANSPORT-MATRIX-MERGE-001
    input: "batch result 只有 transport_status_matrix / source_results。"
    expected_output_boundary:
      - transport_status_matrix_merge_required
      - dennis_generates_source_quality_matrix
      - dennis_generates_missing_evidence
    pass_fail_criteria: "Dennis 仍能合并 source_quality_matrix、missing_evidence 和 evidence card 输入。"
  - case_id: PASSTHROUGH-BODY-TRUNCATED-PARTIAL-001
    input: "body_truncated=true。"
    expected_output_boundary:
      - body_truncated_means_partial_observation
      - partial_observation_available
      - raw_body_capped_limited_observation_only
    pass_fail_criteria: "截断 body 只能作为 partial observation，不得声称完整明细。"
  - case_id: PASSTHROUGH-AUTH-REDIRECT-302-001
    input: "auth_redirect_detected=true 或 api_code=302。"
    expected_output_boundary:
      - auth_flow_not_completed_in_bound_context
      - no_permission_claim_forbidden_without_explicit_permission_denial
      - no_auth_repair
    pass_fail_criteria: "认证跳转 / 302 标认证流程未在受控上下文完成，不直接说用户无权限。"
  - case_id: PASSTHROUGH-SINGLE-SOURCE-TIMEOUT-PARTIAL-001
    input: "batch passthrough 中单 source timeout，其他 source completed。"
    expected_output_boundary:
      - source_timeout_non_blocking_partial
      - timeout_enters_missing_evidence
      - completed_sources_preserved
    pass_fail_criteria: "单 source timeout 不阻塞整体 partial evidence。"
  - case_id: PASSTHROUGH-NODATA-NOT-LOW-RISK-001
    input: "passthrough body_present=false 或 empty result。"
    expected_output_boundary:
      - no_data_not_risk_exclusion
      - no_low_risk_from_empty_result
      - source_quality_matrix_no_data_bucket
    pass_fail_criteria: "no_data 只能进入 source quality，不得作为低风险或无风险反证。"
  - case_id: PASSTHROUGH-RCP-FEATURE-LARGE-PARTIAL-001
    input: "RCP feature list 大响应 capped / partial。"
    expected_output_boundary:
      - feature_list_partial_only_feature_group_summary
      - body_truncated_means_partial_observation
      - no_complete_feature_detail_claim
    pass_fail_criteria: "RCP feature list 大响应由 Dennis 解释为 partial，不声称完整特征明细。"

generalized_workflow_validation_cases_v1:
  real_platform_called: false
  dataagent_called: false
  default_runtime_routing: false
  cases:
    - case_id: GENERIC-REALTIME-EVIDENCE-CLOSED-CONCLUSION-001
      input: "ATO 单案实时登录链路、内容动作链路、设备身份一致性和历史基线均闭合。"
      expected_output_boundary:
        - realtime_readonly_source_collection
        - evidence_chain_closure_check
        - evidence_based_conclusion_allowed
        - source_quality_matrix_required
      pass_fail_criteria: "实时证据闭合时可以给 evidence-based 结论，但仍要保留 source_quality 和时间窗口边界。"
    - case_id: GENERIC-REALTIME-INCOMPLETE-OFFLINE-PLAN-001
      input: "ATO 单案实时源不闭合。"
      expected_output_boundary:
        - partial_evidence_missing_evidence_when_not_closed
        - offline_supplement_plan_by_risk_scene
        - no_forced_final_conclusion
      pass_fail_criteria: "实时不闭合时输出 partial evidence 和离线补证计划，不强判。"
    - case_id: GENERIC-LOGIN-NODATA-NOT-ATO-EXCLUSION-001
      input: "登录日志 no_data。"
      expected_output_boundary:
        - no_data_not_risk_exclusion
        - source_window_gap_not_counter_evidence
        - missing_evidence
      pass_fail_criteria: "登录日志 no_data 不得排除 ATO。"
    - case_id: GENERIC-PHOTO-NODATA-NOT-DIVERSION-EXCLUSION-001
      input: "异常发布 photo search no_data。"
      expected_output_boundary:
        - photo_search_no_data_not_abnormal_publish_exclusion
        - content_action_chain_missing_evidence
        - no_low_risk_from_no_data
      pass_fail_criteria: "异常发布 photo no_data 不得排除导流或内容动作风险。"
    - case_id: GENERIC-ANTI-CHEATING-OFFLINE-SUPPLEMENT-001
      input: "反作弊设备异常实时 source 不足。"
      expected_output_boundary:
        - offline_supplement_plan_by_risk_scene
        - device_wide_table
        - request_behavior_detail
        - feature_wide_table
      pass_fail_criteria: "反作弊实时不足时建议补设备 / 请求 / 行为 / 特征宽表，不写成 Hive 登录表。"
    - case_id: GENERIC-CLUSTER-EXPANSION-FROM-SINGLE-CASE-001
      input: "群控 / 黑产扩散从一个单案找共性。"
      expected_output_boundary:
        - cluster_expansion_when_batch_or_similar
        - shared_time_device_ip_behavior_content_strategy_dimensions
        - representative_sampling
      pass_fail_criteria: "从单案抽共性维度和代表样本，不只输出单用户结论。"
    - case_id: GENERIC-STRATEGY-HIT-SUPPORT-ONLY-001
      input: "只有策略命中。"
      expected_output_boundary:
        - strategy_hit_not_final_judgement
        - raw_evidence_required_for_final_conclusion
        - missing_evidence
      pass_fail_criteria: "策略命中只能辅助，不得单独定性。"
    - case_id: GENERIC-STRATEGY-GOVERNANCE-OFFLINE-EVIDENCE-001
      input: "策略治理需要评估误伤和灰度。"
      expected_output_boundary:
        - strategy_version_release_record
        - hit_sample_false_positive_sample
        - gray_rollout_metrics
        - denominator_and_monitoring_required
      pass_fail_criteria: "策略治理补版本、发布、命中、误伤、灰度样本，不只查单案。"
    - case_id: GENERIC-EXPLICIT-CHECK-REALTIME-PLAN-DATAAGENT-AUTH-001
      input: "帮我查这个用户风险。"
      expected_output_boundary:
