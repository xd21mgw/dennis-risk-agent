{
  "schema_version": "source_orchestration_plan_v1",
  "plans": {
    "single_user_account_security": {
      "applies_to": [
        "single_user_account_security",
        "ATO",
        "ato_case_analysis",
        "login_anomaly"
      ],
      "entity_count": {
        "min": 1,
        "max": 1
      },
      "required_p0_sources": [
        {
          "source_name": "user_login_unified_log",
          "source_type": "realtime_readonly_api",
          "required": true
        },
        {
          "source_name": "weapon_user_to_device_graph",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/apiv2/graphData",
          "expected_query_shape": "product=KUAISHOU&productName=KUAISHOU&groupValue={userId}&groupKey=USER_ID&dimKey=DEVICE_ID&searchLevel=2"
        },
        {
          "source_name": "weapon_device_risk_if_device_id_available",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/apiv2/riskData",
          "expected_query_shape": "product=KUAISHOU&deviceIds={deviceId}"
        },
        {
          "source_name": "track_analysis_getDeviceIds",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/dp/platform/app/analytics/v2/sequence/getDeviceIds",
          "method": "POST"
        },
        {
          "source_name": "track_analysis_getUseDuration",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/dp/platform/app/analytics/v2/sequence/getUseDuration",
          "method": "POST",
          "expected_rows_shape": "object_array_date_duration"
        },
        {
          "source_name": "track_analysis_profile",
          "source_type": "realtime_readonly_api",
          "required": true,
          "required_path_contains": "/dp/platform/app/analytics/v2/sequence/profile",
          "method": "POST",
          "expected_time_fields": "startTime/endTime_ms"
        }
      ],
      "conditional_sources": [
        {
          "source_name": "archives_profile_if_auth_ready",
          "condition": "archives_auth_ready",
          "fallback_status": "blocked_or_not_checked"
        },
        {
          "source_name": "tianshi_if_event_or_source_id_available",
          "condition": "event_id_or_source_id_available",
          "fallback_status": "missing_required_fields_or_not_checked"
        }
      ],
      "cross_source_rules": {
        "weapon_graphdata_empty_not_no_device": true,
        "allow_track_analysis_device_id_for_weapon_riskdata": true,
        "cross_source_device_id_marker_required": true
      },
      "stop_conditions": {
        "allow_stop_after_login_log_only": false,
        "allow_final_conclusion_without_source_completion_matrix": false,
        "allow_low_risk_from_no_data_only": false
      },
      "source_completion_matrix_required_fields": [
        "source_name",
        "source_status",
        "source_quality",
        "evidence_time_range",
        "collected_at",
        "source_provenance"
      ]
    }
  }
}
