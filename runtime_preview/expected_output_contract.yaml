preview_expected_output_contract:
  version: v1
  required_top_level_sections:
    - route_decision
    - execution_mode
    - source_plan
    - source_completion_matrix
    - evidence_card
    - source_quality
    - routing_metadata
    - expected_user_answer
    - uncertainty_due_to_missing_runtime_info
    - contract_compliance_check
  allowed_source_status:
    - completed
    - no_data
    - auth_failed
    - blocked
    - timeout
    - parse_error
    - skipped
    - tool_gap
  forbidden_conclusions:
    - no_data_as_no_risk
    - strategy_hit_as_final_ato_judgement
    - stale_data_as_realtime
    - mock_as_real_query
    - partial_as_final
    - platform_failure_as_no_risk
    - source_silent_skip
  allowed_final_states:
    - confirmed_risk
    - likely_risk
    - suspicious_needs_more_evidence
    - inconclusive_partial
    - low_confidence
    - blocked_insufficient_contract
    - blocked_contract_conflict
  preview_status_values:
    - PASS_EXPECTED_BEHAVIOR
    - PREVIEW_FAILED_CONTRACT_VIOLATION
    - PREVIEW_BLOCKED_INSUFFICIENT_CONTRACT
    - PREVIEW_BLOCKED_CONTRACT_CONFLICT
